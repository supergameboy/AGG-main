    englishId: event
    description: 事件Agent，管理事件触发和处理
    whenToInvoke: GameMasterAgent需要执行事件相关操作时调用
    system_prompt_file: ./prompts/event.md
    provider_id: null
    temperature: 0.5
    max_tokens: 4096
    isSubAgent: true
