    provider_id: null
    temperature: 0.6
    max_tokens: 4096
    isSubAgent: true
    enableSpawnAgent: false
    tools:
      - npc_service
      - entity_graph_service
      - numerical_service
      - inventory_service
      - skill_service
      - template_pool_service
