      - numerical_service
      - game_time_service
      - character_service
      - inventory_service
      - event_service
      - npc_service
      - skill_service
      - rule_service
      - skill_loader
      - help_service
    rules:
      # dir/hooked 仅用于 ConfigLoader 校验，运行时由 skills 的 hook 配置决定加载
      dir: config/agent-rules/quest
      alwaysApply:
        - quest-core
        - quest-visibility
      hooked:
        - quest-accept-check
        - quest-complete-reward
    skills:
      # dir 仅用于 ConfigLoader 校验技能文件是否存在，运行时由 SkillRegistry 从 skills 的 hook 配置加载技能
      dir: config/agent-skills/quest
      list:
