    tools:
      - event_service
      - game_time_service
      - rule_service
      - skill_loader
      - help_service
    rules:
      # dir 仅用于 ConfigLoader 校验，运行时由 PromptModule 从 skills 的 hook 配置加载规则
      dir: config/agent-rules/event
      alwaysApply:
        - event-core
    skills:
      # dir 仅用于 ConfigLoader 校验技能文件是否存在，运行时由 SkillRegistry 从 skills 的 hook 配置加载技能
      dir: config/agent-skills/event
