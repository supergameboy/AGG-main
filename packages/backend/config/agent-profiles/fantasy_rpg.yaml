        - config/agent-help/template_pool_service
        - config/agent-help/numerical_service
        - config/agent-help/character_service
        - config/agent-help/game_init_service
      autoLoadOnFirstUse: false
    capabilities:
      supported_intents: [use_item, equip_item, unequip_item, buy_item, sell_item, list_inventory, get_item, item_pool_init]
      required_fields: [saveId, action]
      optional_fields: [itemId, targetId, quantity, equipmentSlot]

  skill:
    name: SkillAgent
    englishId: skill
    description: 技能Agent，管理技能使用和学习
    whenToInvoke: GameMasterAgent需要执行技能相关操作时调用
    system_prompt_file: ./prompts/skill.md
    provider_id: null
    temperature: 0.5
    max_tokens: 4096
    isSubAgent: true
