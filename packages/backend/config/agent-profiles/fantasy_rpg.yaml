    skills:
      # dir 仅用于 ConfigLoader 校验技能文件是否存在，运行时由 SkillRegistry 从 skills 的 hook 配置加载技能
      dir: config/agent-skills/npc_party
      list:
        - npc-attribute-init
        - npc-behavior
        - npc-creation
        - npc-equipment-init
        - npc-skill-init
    help:
      dirs:
        - config/agent-help/npc_service
        - config/agent-help/entity_graph_service
        - config/agent-help/numerical_service
        - config/agent-help/inventory_service
        - config/agent-help/skill_service
        - config/agent-help/template_pool_service
      autoLoadOnFirstUse: false
    capabilities:
      # 模块2 简化：删除 relationship_update 意图（NPC 关系由 entity_graph_service.set_relationship 维护，不再独立 intent）
      supported_intents: [npc_interact, npc_create, npc_update, party_manage, npc_skill_init, npc_equipment_init]
      required_fields: [saveId, action]
      optional_fields: [targetNpcId, partyAction]

  inventory:
    name: InventoryAgent
    englishId: inventory
    description: 物品管理Agent，管理背包、装备和使用物品
    whenToInvoke: GameMasterAgent需要执行物品相关操作时调用
    system_prompt_file: ./prompts/inventory.md
    provider_id: null
    temperature: 0.3
    max_tokens: 6144
    isSubAgent: true
    enableSpawnAgent: false
    tools:
      - inventory_service
      - template_pool_service
      - numerical_service
      - character_service
      - game_init_service
      - rule_service
