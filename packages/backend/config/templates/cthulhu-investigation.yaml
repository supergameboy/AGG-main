ui_theme:
  primary_color: "#4a5568"
  font_family: serif
  background_style: gradient
  gradient_colors:
    start: "#1a1a2e"
    end: "#0d0d1a"
    direction: to bottom
  background_image: ""
  pattern_type: zigzag
  animated_type: mist
  custom_css: ""

ui_layout:
  show_minimap: false
  show_combat_panel: false
  show_skill_bar: true
  show_party_panel: true
  minimap_position: top-left
  minimap_size: small
  party_panel_position: left
  skill_bar_slots: 4
  custom_layout: ""

special_rules:
  has_kp: true
  permadeath: true
  save_restriction: checkpoint_only
  custom_rules:
    - 理智值系统：目击恐怖事件或接触禁忌知识会降低理智值，理智值归零则角色永久疯狂
    - 禁忌知识：阅读禁忌典籍可以获得强大力量，但会付出理智的代价
    - 守密人(KP)系统：KP负责描述场景和判定结果，引导恐怖氛围
    - 永久死亡：角色死亡不可复活，请谨慎行动
    - 检查点存档：仅在关键剧情节点可以存档
