skills:
  - id: keen-observation
    name: 敏锐观察
    description: 侦探训练有素的双眼能捕捉常人忽视的细节——墙上的刮痕、地毯上的泥印、空气中不自然的腥味。在阿卡姆，每一个微小的异常都可能是通向真相的线索，也可能是通向疯狂的入口。
    type: utility
    element: physical
    target_type: self
    cost:
      mana: 5
    damage: {}
    effects:
      - type: perception_boost
        value: 3
        duration: 2
        description: 感知判定获得+3加值，持续2回合
    cooldown: 0
    range: 0
    icon: 👁
    custom_data:
      class: detective
      skill_tier: 1
      locale: zh-CN

  - id: logical-deduction
    name: 逻辑推理
    description: 将碎片化的线索串联成完整的推理链条。从一封匿名信到一座废弃的宅邸，从一声深夜的低语到一个消失的家族——逻辑是你在混沌中唯一的锚点。但有些真相，逻辑也无法解释。
    type: utility
    element: physical
    target_type: self
    cost:
      mana: 8
    damage: {}
    effects:
      - type: investigation_boost
        value: 4
        duration: 1
        description: 调查判定获得+4加值，持续1回合
      - type: clue_reveal
        value: 1
        description: 有概率揭示隐藏线索
    cooldown: 2
    range: 0
    icon: 🧠
    custom_data:
      class: detective
      skill_tier: 2
      locale: zh-CN

  - id: interrogation
    name: 审讯施压
    description: 用锐利的目光和精准的提问击碎嫌疑人的心理防线。你知道在哪里施加压力，在哪里留出缝隙——恐惧和信任，都是撬开嘴巴的工具。但在阿卡姆，有些人口中的真相比谎言更加恐怖。
    type: debuff
    element: physical
    target_type: single
    cost:
      mana: 10
    damage: {}
    effects:
      - type: will_reduction
        value: 3
        duration: 2
        description: 降低目标意志3点，持续2回合
      - type: information_extract
        value: 1
        description: 有概率获取额外情报
    cooldown: 3
    range: 1
    icon: 🔍
    custom_data:
      class: detective
      skill_tier: 2
      locale: zh-CN

  - id: evidence-collection
    name: 证据搜集
    description: 系统性地搜索和记录现场的一切痕迹。指纹、足迹、血迹、纤维——每一件证据都是拼图的一角。你的笔记本上画满了箭头和圈注，但有些证据指向的方向，你宁愿没有发现。
    type: utility
    element: physical
    target_type: self
    cost:
      mana: 6
    damage: {}
    effects:
      - type: evidence_bonus
        value: 3
        duration: 3
        description: 证据搜集判定获得+3加值，持续3回合
      - type: clue_preservation
        value: 1
        description: 防止线索因时间流逝而丢失
    cooldown: 1
    range: 0
    icon: 📋
    custom_data:
      class: detective
      skill_tier: 1
      locale: zh-CN

  - id: shadowing
    name: 暗影尾随
    description: 融入阿卡姆的雾气和暗巷，像一道无声的影子跟踪目标。你的脚步轻得像猫，呼吸缓得像死物。但当你凝视着黑暗中那道身影时，你偶尔会感到——黑暗也在凝视着你。
    type: utility
    element: shadow
    target_type: self
    cost:
      mana: 7
    damage: {}
    effects:
      - type: stealth_boost
        value: 4
        duration: 3
        description: 潜行判定获得+4加值，持续3回合
      - type: shadow_meld
        value: 1
        description: 在黑暗区域获得额外隐蔽加值
    cooldown: 2
    range: 0
    icon: 🌑
    custom_data:
      class: detective
      skill_tier: 2
      sanity_risk: 1
      locale: zh-CN

  - id: first-aid
    name: 急救处置
    description: 迅速而冷静地处理伤口——止血、消毒、包扎。在阿卡姆的暗巷中，你见过太多不该出现的伤口：撕裂伤的边缘过于整齐，穿刺伤的角度违背解剖学常识。但无论伤口多么诡异，血总是要止的。
    type: healing
    element: physical
    target_type: ally
    cost:
      mana: 8
    damage: {}
    effects:
      - type: heal
        value: 25
        description: 恢复目标25点生命值
      - type: bleed_stop
        value: 1
        description: 止血，防止持续伤害
    cooldown: 2
    range: 1
    icon: ⚕
    custom_data:
      class: doctor
      skill_tier: 1
      locale: zh-CN

  - id: psychological-analysis
    name: 心理剖析
    description: 透过表象洞察目标的精神世界。你受过专业的精神分析训练，能从细微的表情变化和言语漏洞中读取隐藏的真相。但深入他人的心灵就像潜入深海——你永远不知道黑暗中潜伏着什么。
    type: debuff
    element: shadow
    target_type: single
    cost:
      mana: 12
    damage: {}
    effects:
      - type: psychology_insight
        value: 3
        duration: 2
        description: 揭示目标隐藏的心理状态和秘密
      - type: will_shatter
        value: 2
        duration: 1
        description: 降低目标意志2点，持续1回合
    cooldown: 3
    range: 2
    icon: 🌀
    custom_data:
      class: doctor
      skill_tier: 3
      sanity_risk: 2
      locale: zh-CN

  - id: forensic-examination
    name: 法医检验
    description: 以科学的严谨检验尸体和物证。组织切片、毒理分析、创伤比对——你相信科学能解释一切。直到你在一具尸体的胃里发现了不属于地球任何已知生物的组织样本。
    type: utility
    element: physical
    target_type: self
    cost:
      mana: 10
    damage: {}
    effects:
      - type: forensic_insight
        value: 4
        duration: 2
        description: 法医判定获得+4加值，持续2回合
      - type: cause_of_death
        value: 1
        description: 确定死因，获取关键线索
    cooldown: 2
    range: 0
    icon: 🔬
    custom_data:
      class: doctor
      skill_tier: 2
      locale: zh-CN

  - id: emergency-surgery
    name: 紧急手术
    description: 在最恶劣的条件下进行外科手术——没有无菌室，没有麻醉师，只有你颤抖的双手和冰冷的手术刀。生命在你指间流逝，你必须比死神更快。但有些伤口，你的手术刀无法触及——它们不在身体上。
    type: healing
    element: physical
    target_type: ally
    cost:
      mana: 18
    damage: {}
    effects:
      - type: major_heal
        value: 50
        description: 恢复目标50点生命值
      - type: critical_stabilize
        value: 1
        description: 稳定濒死状态的目标
    cooldown: 4
    range: 1
    icon: 🩺
    custom_data:
      class: doctor
      skill_tier: 3
      locale: zh-CN

  - id: sanity-counseling
    name: 理智疏导
    description: 用专业的话语和温和的引导，帮助崩溃的同伴重新抓住现实的边缘。你告诉他们那只是幻觉，那只是恐惧的产物——但你自己的手也在颤抖，因为你看到了同样的东西。
    type: healing
    element: shadow
    target_type: ally
    cost:
      mana: 15
    damage: {}
    effects:
      - type: sanity_restore
        value: 10
        description: 恢复目标10点理智值
      - type: fear_suppress
        value: 2
        duration: 3
        description: 压制恐惧效果，持续3回合
    cooldown: 3
    range: 1
    icon: 💫
    custom_data:
      class: doctor
      skill_tier: 2
      sanity_risk: 1
      locale: zh-CN

  - id: information-gathering
    name: 情报刺探
    description: 在酒馆的角落里竖起耳朵，在码头的烟雾中交换消息，在警察局的走廊上偷听谈话。阿卡姆的每条街巷都是情报的河流，而你是最好的渔夫。但有些消息一旦听到，就再也无法从脑海中抹去。
    type: utility
    element: physical
    target_type: self
    cost:
      mana: 6
    damage: {}
    effects:
      - type: intel_gather
        value: 2
        duration: 2
        description: 情报搜集判定获得+2加值，持续2回合
      - type: rumor_network
        value: 1
        description: 有概率获取额外传闻
    cooldown: 1
    range: 0
    icon: 🗣
    custom_data:
      class: journalist
      skill_tier: 1
      locale: zh-CN

  - id: persuasive-interview
    name: 诱导采访
    description: 用精心设计的问题引导受访者说出他们本不想说的话。一个微笑、一声叹息、一次恰到好处的沉默——都是你的武器。人们总是愿意对记者倾诉，但你有时会听到比新闻更可怕的故事。
    type: buff
    element: physical
    target_type: ally
    cost:
      mana: 8
    damage: {}
    effects:
      - type: charisma_boost
        value: 3
        duration: 2
        description: 魅力判定获得+3加值，持续2回合
      - type: trust_gain
        value: 1
        description: 提升NPC信任度
    cooldown: 2
    range: 1
    icon: 📝
    custom_data:
      class: journalist
      skill_tier: 1
      locale: zh-CN

  - id: photographic-evidence
    name: 闪光取证
    description: 镁光灯爆闪的瞬间，黑暗中的真相被定格在胶片上。照片不会说谎——但有时，冲洗出来的底片上会出现拍摄时并不存在的身影。那些影子站在你身后，微笑着。
    type: attack
    element: physical
    target_type: aoe
    cost:
      mana: 10
    damage:
      base: 8
      scaling:
        attribute: str
        multiplier: 0.3
    effects:
      - type: blind
        value: 1
        duration: 1
        description: 闪光致盲区域内敌人1回合
      - type: evidence_capture
        value: 1
        description: 记录现场证据，不可销毁
    cooldown: 3
    range: 3
    icon: 📸
    custom_data:
      class: journalist
      skill_tier: 2
      sanity_risk: 1
      locale: zh-CN

  - id: quick-writing
    name: 速笔记录
    description: 以惊人的速度将观察和对话转化为文字记录。你的速记符号只有自己能读懂，但正是这些潦草的笔记，在事后拼凑出了完整的真相。有时你回看笔记，发现某些段落不是你的笔迹——那些扭曲的字迹诉说着你从未听过的语言。
    type: utility
    element: physical
    target_type: self
    cost:
      mana: 4
    damage: {}
    effects:
      - type: record_preservation
        value: 1
        description: 永久记录当前场景信息
      - type: detail_recall
        value: 2
        duration: 3
        description: 记忆判定获得+2加值，持续3回合
    cooldown: 0
    range: 0
    icon: ✏
    custom_data:
      class: journalist
      skill_tier: 1
      locale: zh-CN

  - id: undercover-investigation
    name: 潜入暗访
    description: 伪装身份深入阿卡姆最危险的角落——邪教的地下集会、走私者的秘密仓库、被封锁的精神病院。你以假面示人，每一步都走在刀刃上。当周围的人开始用你不理解的语言祈祷时，你知道自己已经走得太深了。
    type: utility
    element: shadow
    target_type: self
    cost:
      mana: 14
    damage: {}
    effects:
      - type: disguise
        value: 4
        duration: 4
        description: 伪装判定获得+4加值，持续4回合
      - type: deep_cover
        value: 1
        description: 获得进入限制区域的权限
    cooldown: 4
    range: 0
    icon: 🎭
    custom_data:
      class: journalist
      skill_tier: 3
      sanity_risk: 3
      locale: zh-CN

  - id: ancient-languages
    name: 古语解读
    description: 破译那些早已消亡的语言——苏美尔楔形文字、埃及象形文字、以及某些不属于任何已知文明的符号。后者让你既着迷又恐惧，因为当你读出那些音节时，空气中的温度似乎下降了。
    type: utility
    element: arcane
    target_type: self
    cost:
      mana: 10
    damage: {}
    effects:
      - type: language_decode
        value: 4
        duration: 2
        description: 语言解读判定获得+4加值，持续2回合
      - type: ancient_text_access
        value: 1
        description: 解锁阅读禁忌文本的能力
    cooldown: 2
    range: 0
    icon: 📜
    custom_data:
      class: professor
      skill_tier: 2
      sanity_risk: 2
      locale: zh-CN

  - id: artifact-analysis
    name: 邪物鉴定
    description: 用学术的严谨检验那些不该存在的器物——材质分析、年代测定、纹样比对。有些器物散发着令人不安的寒意，有些在黑暗中会自行移动，还有些……还有心跳。你告诉自己这只是共振现象，但你无法说服自己的双手停止颤抖。
    type: utility
    element: arcane
    target_type: self
    cost:
      mana: 12
    damage: {}
    effects:
      - type: artifact_identify
        value: 3
        duration: 2
        description: 遗物鉴定判定获得+3加值，持续2回合
      - type: curse_detect
        value: 1
        description: 检测物品上的诅咒或超自然属性
    cooldown: 3
    range: 0
    icon: 🏺
    custom_data:
      class: professor
      skill_tier: 2
      sanity_risk: 2
      locale: zh-CN

  - id: library-research
    name: 典籍检索
    description: 在米斯卡塔尼克大学图书馆的幽深书架间穿行，你比任何人都清楚哪本书放在哪个位置——包括那些被锁在禁区书架上的。知识就是力量，但在阿卡姆，某些知识本身就是一种诅咒。
    type: utility
    element: arcane
    target_type: self
    cost:
      mana: 6
    damage: {}
    effects:
      - type: research_boost
        value: 3
        duration: 3
        description: 学术研究判定获得+3加值，持续3回合
      - type: restricted_access
        value: 1
        description: 获得图书馆禁区的进入权限
    cooldown: 1
    range: 0
    icon: 📚
    custom_data:
      class: professor
      skill_tier: 1
      locale: zh-CN

  - id: occult-knowledge
    name: 禁忌知识
    description: 那些不该被人类知晓的秘密——旧日的名讳、深渊的坐标、现实的裂缝。你从禁忌典籍的字里行间拼凑出这些知识，每理解一个概念，你对世界的认知就崩塌一分。力量与疯狂只有一线之隔，而你正站在那条线上。
    type: buff
    element: shadow
    target_type: self
    cost:
      mana: 20
      sanity: 5
    damage: {}
    effects:
      - type: occult_power
        value: 5
        duration: 3
        description: 神秘学判定获得+5加值，持续3回合
      - type: mythos_insight
        value: 2
        duration: 2
        description: 获得对超自然存在的洞察，持续2回合
      - type: sanity_drain
        value: 5
        description: 消耗5点理智值
    cooldown: 5
    range: 0
    icon: 🕯
    custom_data:
      class: professor
      skill_tier: 3
      sanity_risk: 5
      forbidden: true
      locale: zh-CN

  - id: ritual-decipher
    name: 仪式破译
    description: 解读那些亵渎的仪式文本——献祭的顺序、召唤的咒语、封印的阵法。你告诉自己研究这些只是为了阻止它们，但每破译一个仪式，你离那个不可名状的世界就更近一步。有些仪式只需要一个念错音节的失误……
    type: utility
    element: shadow
    target_type: self
    cost:
      mana: 15
    damage: {}
    effects:
      - type: ritual_understand
        value: 4
        duration: 2
        description: 仪式解读判定获得+4加值，持续2回合
      - type: counter_ritual
        value: 1
        description: 有概率找到对抗仪式的方法
      - type: sanity_tremor
        value: 2
        description: 接触亵渎知识，理智值轻微动摇
    cooldown: 4
    range: 0
    icon: ⛧
    custom_data:
      class: professor
      skill_tier: 3
