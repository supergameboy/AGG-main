id: cthulhu-investigation
name: 克苏鲁恐怖调查
description: 1920年代的新英格兰阿卡姆镇，古老的秘密正在苏醒。作为调查员，你将面对超越人类理解的恐怖真相。理智在崩塌，现实在扭曲——你能否在疯狂吞噬你之前揭开谜团？
version: 1.0.0
author: AGG Team
tags:
  - horror
  - investigation
  - lovecraft
  - cthulhu
  - 1920s

game_mode: text_adventure
default_challenge_mode: narrative_combat
numerical_complexity: medium
agent_profile: fantasy_rpg
is_builtin: true

world_setting:
  name: 阿卡姆镇
  description: 1920年代的新英格兰小镇，米斯卡塔尼克河缓缓流过。阿卡姆是一座古老的小镇，哥特式的建筑在雾气中若隐若现。米斯卡塔尼克大学收藏着禁忌的典籍，而镇外的森林和山丘中隐藏着不可名状的秘密。古老的邪教在暗处活动，异界的低语在深夜回响。
  era: 1920年代
  genre: horror
  magic_system: 克苏鲁神话 - 禁忌知识与古老仪式
  technology_level: 20世纪初
  custom_fields:
    location: 美国马萨诸塞州
    university: 米斯卡塔尼克大学
    currency: 美元
    sanity_system: 理智值(POW)
    mythos: 克苏鲁神话体系

character_creation:
  attribute_points: 10
  attribute_role_mapping:
    physical_power: str
    agility: dex
    endurance: con
    mental_power: int
    perception: wis
    influence: cha
  races:
    - id: local-resident
      name: 本地居民
      description: 在阿卡姆土生土长，对这座小镇的怪异早已习以为常。你知道哪些地方不该去，哪些话题不该提。但最近发生的事，已经超出了你的认知。
      bonuses:
        con: 1
      penalties: {}
      abilities:
        - 本地知识
        - 镇民关系网
      available_classes:
        - detective
        - doctor
        - journalist
        - professor
    - id: immigrant
      name: 外来移民
      description: 从远方来到阿卡姆谋生，你对这座小镇的一切都感到陌生和不安。但正因为你不受旧习束缚，你能看到本地人忽视的线索。
      bonuses:
        dex: 1
        int: 1
      penalties:
        cha: -1
      abilities:
        - 外来者视角
        - 多语言能力
      available_classes:
        - detective
        - doctor
        - professor
    - id: scholar-family
      name: 学者家族
      description: 出身学术世家，你的家族与米斯卡塔尼克大学有着深厚的渊源。家中的藏书室里藏着一些不该存在的书籍，而你从小就对那些奇怪的符号感到不安。
      bonuses:
        int: 2
      penalties:
        con: -1
      abilities:
        - 学术传承
        - 禁忌知识直觉
      available_classes:
        - doctor
        - professor
    - id: occult-bloodline
      name: 神秘血统
      description: 你的血脉中流淌着不可名状的力量。噩梦从幼年就纠缠着你，你偶尔能感知到常人无法察觉的存在。这份天赋是祝福还是诅咒，取决于你如何使用它。
      bonuses:
        wis: 2
      penalties:
        cha: -1
      abilities:
        - 灵视
        - 梦境感知
      available_classes:
        - detective
        - doctor
        - professor

  classes:
    - id: detective
      name: 侦探
      description: 私人侦探，擅长搜集线索和逻辑推理。你受雇调查阿卡姆的失踪案件，却发现自己卷入了一场超越想象的恐怖之中。
      primary_attributes:
        - int
        - dex
      hit_die: d8
      skill_proficiencies:
        - investigation
        - perception
        - stealth
      starting_equipment:
        - revolver
        - magnifying-glass
        - detective-notebook
    - id: doctor
      name: 医生
      description: 米斯卡塔尼克大学的医学教授，对人类精神有着深入的研究。你开始怀疑，某些"精神病患"的症状并非源于疾病，而是源于某种不可名状的接触。
      primary_attributes:
        - int
        - wis
      hit_die: d8
      skill_proficiencies:
        - medicine
        - psychology
        - science
      starting_equipment:
        - medical-bag
        - scalpel
        - psychiatric-notes
    - id: journalist
      name: 记者
      description: 阿卡姆公报的调查记者，总是追着离奇的新闻跑。你最近收到的一封匿名信，将你引向了一个远比任何新闻都恐怖的真相。
      primary_attributes:
        - cha
        - dex
      hit_die: d6
      skill_proficiencies:
        - persuasion
        - investigation
        - photography
      starting_equipment:
        - camera
        - press-badge
        - typewriter
    - id: professor
      name: 教授
      description: 米斯卡塔尼克大学的考古学教授，对古代文明有着渊博的知识。你在一次发掘中接触到了不该接触的东西，从此你的世界再也不一样了。
      primary_attributes:
        - int
        - wis
      hit_die: d6
      skill_proficiencies:
        - arcana
        - history
        - library-use
      starting_equipment:
        - ancient-tome
        - decoding-lens
        - university-credentials

  backgrounds:
    - id: middle-class
      name: 中产阶级
      description: 体面的中产家庭，有稳定的工作和收入。你在阿卡姆过着平静的生活，直到那个雨夜，一切都变了。
      skill_proficiencies:
        - credit-rating
        - etiquette
      languages:
        - latin
      equipment:
        - formal-attire
        - pocket-watch
        - house-key
      feature: 体面身份 - 你在社会上有着可靠的信用和人际关系
      attribute_bonuses:
        cha: 1
    - id: working-class
      name: 工人阶级
      description: 靠双手吃饭的劳动者，生活虽不富裕但踏实。你见过太多上流社会看不到的东西，包括那些在暗巷中出没的身影。
      skill_proficiencies:
        - survival
        - mechanics
      languages: []
      equipment:
        - work-clothes
        - toolbox
        - flask
      feature: 街头智慧 - 你了解底层社会的规则和生存之道
      attribute_bonuses:
        con: 1
    - id: upper-class
      name: 上流社会
      description: 出身名门望族，家族在阿卡姆有着百年的历史。但你也知道，家族的荣耀之下隐藏着不可告人的秘密。
      skill_proficiencies:
        - persuasion
        - credit-rating
      languages:
        - french
        - latin
      equipment:
        - tailored-suit
        - cane-sword
        - family-heirloom
      feature: 旧钱势力 - 你的家族名字能打开许多门，也可能引来危险的关注
      attribute_bonuses:
        int: 1
    - id: marginalized
      name: 边缘人群
      description: 生活在社会边缘的人，无人在意你的存在。但正因如此，你能去到别人不敢去的地方，听到别人听不到的耳语。
      skill_proficiencies:
        - stealth
        - streetwise
      languages:
        - thieves-cant
      equipment:
        - worn-coat
        - lockpicks
        - hidden-dagger
      feature: 隐形人 - 你习惯了不被注意，这让你能轻松地观察和跟踪
      attribute_bonuses:
        dex: 1

  attributes:
    - id: str
      name: 力量
      abbreviation: STR
      description: 体能和力量，影响近战攻击和体力活动
      min_value: 1
      default_value: 10
      max_value: 20
    - id: dex
      name: 敏捷
      abbreviation: DEX
      description: 灵活性和反应速度，影响闪避和远程攻击
      min_value: 1
      default_value: 10
      max_value: 20
    - id: con
      name: 体质
      abbreviation: CON
      description: 耐力和抗性，影响生命值和理智恢复
      min_value: 1
      default_value: 10
      max_value: 20
    - id: int
      name: 智力
      abbreviation: INT
      description: 知识和推理能力，影响调查和学术判定
      min_value: 1
      default_value: 10
      max_value: 20
    - id: wis
      name: 感知
      abbreviation: WIS
      description: 洞察力和意志力，影响理智判定和灵视
      min_value: 1
      default_value: 10
      max_value: 20
    - id: cha
      name: 魅力
      abbreviation: CHA
      description: 社交能力和说服力，影响交涉和号召
      min_value: 1
      default_value: 10
      max_value: 20

  custom_options: []

  age_mode: group
  age_groups:
    - id: youth
      name: 青年
      description: 年轻气盛，身手敏捷但经验不足
      bonuses:
        dex: 1
      penalties:
        wis: -1
    - id: middle
      name: 中年
      description: 经验丰富，判断力强但体力下降
      bonuses:
        wis: 1
      penalties:
        dex: -1
    - id: elder
      name: 老年
      description: 学识渊博，但身体衰弱
      bonuses:
        int: 1
        wis: 1
      penalties:
        str: -1
        con: -1

game_rules:
  combat_system:
    type: narrative
    initiative_type: dexterity
    custom_initiative: ""
    action_points: 1
    critical_hit:
      threshold: 20
      multiplier: 2
    flee:
      base_chance: 0.5
      per_dead_enemy_bonus: 0.2
    defend:
      damage_reduction: 0.6
    damage_formula:
      attack_contribution: 0.4
      defense_reduction: 0.6
      level_bonus_factor: 1
      variance_min: 0.8
      variance_range: 0.4
    enemy_ai:
      skill_use_chance: 0.2
    defaults:
      potion_heal: 20
      mana_potion_restore: 15
      skill_mana_cost: 8
      skill_damage_multiplier: 1.3
      skill_base_damage_factor: 1.5
      attribute_fallback: 10
      enemy_speed_factor: 1
  derived_attribute_formulas:
    maxHealth:
      base: 100
      coefficients: { physical_power: 5, endurance: 15 }
    maxMana:
      base: 50
      coefficients: { mental_power: 10, endurance: 2 }
    attack:
      base: 10
      coefficients: { physical_power: 2, agility: 0.5 }
    defense:
      base: 5
      coefficients: { endurance: 1.5, physical_power: 0.5 }
    magicAttack:
      base: 8
      coefficients: { mental_power: 2.5, perception: 0.3 }
    magicDefense:
      base: 4
      coefficients: { mental_power: 1, endurance: 0.3 }
    speed:
      base: 10
      coefficients: { agility: 1.5, influence: 0.2 }
    critRate:
      base: 0.05
      coefficients: { agility: 0.01, influence: 0.005 }
      max: 0.5
    critDamage:
      base: 1.5
      coefficients: { physical_power: 0.02, influence: 0.01 }
    dodgeRate:
      base: 0.05
      coefficients: { agility: 0.008 }
      max: 0.3
    blockRate:
      base: 0.9
      coefficients: { agility: 0.005, perception: 0.002 }
  skill_system:
    max_level: 10
    cooldown_system: none
    upgrade_cost:
      base: 80
      multiplier: 1.5
  inventory_system:
    max_slots: 15
    weight_system: true
    stack_sizes:
      ammunition: 20
      clue: 1
      consumable: 5
    equipment_slots:
      - id: main_hand
        name: 主手
        icon: ⚔
        accepted_item_types:
          - weapon
      - id: body
        name: 身体
        icon: 🛡
        accepted_item_types:
          - armor
      - id: head
        name: 头部
        icon: 🎩
        accepted_item_types:
          - armor
          - accessory
      - id: accessory
        name: 饰品
        icon: 💍
        capacity: 2
        accepted_item_types:
          - accessory
  quest_system:
    max_active: 5
    time_system: true
    fail_conditions:
      - timeout
      - sanity-loss
      - npc-death
  currency_system:
    id: dollar
    name: 美元
    icon: 💵
  custom_rules:
    - name: 理智值系统
      description: 目击恐怖事件或接触禁忌知识会降低理智值，理智值归零则角色永久疯狂
    - name: 禁忌知识
      description: 阅读禁忌典籍可以获得强大力量，但会付出理智的代价

ai_constraints:
  tone: dark
  custom_tone: ""
  content_rating: mature
  prohibited_topics:
    - explicit-content
  required_elements:
    - horror
    - investigation
    - sanity-mechanics
    - cosmic-dread
  ai_behavior:
    response_style: narrative
    detail_level: detailed
    player_agency: balanced

starting_scene:
  location: arkham-police-station
  description: 1920年的深秋，阿卡姆镇笼罩在一层薄雾之中。你站在警察局门口，手中握着一封匿名信。信上只有一句话："如果你想找到失踪的人，今晚来印斯茅斯路17号。"警长从你身边经过，他的表情阴沉，似乎这座小镇的每个人都在隐瞒着什么......
  location_description: 阿卡姆警察局，1920年代新英格兰小镇的执法机构
  atmosphere: 阴沉压抑，薄雾笼罩，每个人都像在隐瞒着什么

  sub_locations:
    - id: police-lobby
      name: 警察局大厅
      description: 狭窄昏暗的接待大厅，墙上贴满了失踪人口的寻人启事，有些已经泛黄卷边。木制长椅上坐着几位面容焦虑的镇民，他们低声交谈，不时警觉地看向门口。柜台后的警员面色疲惫，对每一个报案都报以同样的冷漠回应。角落里的老式挂钟滴答作响，仿佛在为失踪者倒计时。
      type: lobby
      is_starting: true
      danger_level: 0

    - id: ward-office
      name: 沃德探长办公室
      description: 一间弥漫着烟草味的狭小办公室，桌上堆满了案卷和烟灰缸。墙上钉着一张阿卡姆地图，地图上用红色图钉标注着失踪地点，它们诡异地排列成一个不规则的圆弧。窗户被厚重的窗帘遮住，只有桌上的台灯投下昏黄的光圈。
      type: office
      danger_level: 0

    - id: evidence-room
      name: 证物室
      description: 警察局地下室的证物存放处，铁架上整齐排列着标有编号的证物箱。最里侧的铁柜上挂着"禁止入内"的牌子，柜门上的锁似乎最近被更换过。空气中弥漫着陈旧纸张和某种说不出的腥味，灯光偶尔闪烁，仿佛有什么东西在暗处窥视。
      type: storage
      danger_level: 1

    - id: station-exit
      name: 警察局出口
      description: 警察局正门外的石阶，阿卡姆的薄雾在此处格外浓重。街灯在雾中发出朦胧的橘黄色光芒，远处隐约可见米斯卡塔尼克河的轮廓。偶尔有马车经过，马蹄声在雾中回荡，听起来格外寂寥。
      type: gate
      danger_level: 0
      connections:
        - innsmouth-road-entrance
        - university-entrance

  npcs:
    - id: inspector-ward
      location: ward-office
      name: 沃德探长
      title: 阿卡姆警察局探长
      description: 一位疲惫的中年探长，眼圈深黑，烟不离手。他负责调查最近的一系列失踪案，但似乎遇到了无法解释的阻力。
      role: informant
      race: human
      appearance: 灰色风衣，软呢帽，指间夹着半截香烟，眼中满是疲惫
      personality: 严肃、多疑、内心挣扎
      dialogue:
        - 你也是来调查失踪案的？我劝你趁早放弃。
        - 有些事情......不是人类应该知道的。
        - 最近三周，已经有七个人失踪了。没有任何线索，就像凭空消失了一样。
      stats:
        level: 4
        hp: 35
        attack: 10
        defense: 7
        speed: 5
        magic: 3
      services:
        - information
        - quest
      custom_data:
        sanity: 65
        knows_truth: partial
  items:
    - id: anonymous-letter
      name: 匿名信
      description: 一封用打字机打印的匿名信，纸张泛黄，墨水有淡淡的腥味。信上只有一句话和一个地址。
      type: quest
      rarity: unique
      stats: {}
      effects: []
      value:
        buy: 0
        sell: 0
        currency: dollar
      quantity: 1
      custom_data:
        displayType: 任务物品
        displayRarity: 独特
        displayStats: []
        displayEffects:
          - 指向印斯茅斯路17号的线索
        tags: [quest, clue, letter, investigation]
        locale: zh-CN
        is_clue: true
        clue_type: lead
        location: innsmouth-road-17
  quests:
    - id: investigation-quest-1
      name: 消失的人们
      description: 调查阿卡姆镇近期发生的一系列失踪案件，从匿名信的线索开始，揭开隐藏在小镇之下的恐怖真相。
      type: main
      objectives:
        - id: iq1-1
          description: 与沃德探长交谈了解失踪案详情
          type: talk
          target: inspector-ward
          required: 1
        - id: iq1-2
          description: 前往印斯茅斯路17号调查
          type: explore
          target: innsmouth-road-17
          required: 1
        - id: iq1-3
          description: 收集至少3条关于失踪者的线索
          type: collect
          target: clue
          required: 3
      rewards:
        - type: experience
          value: 80
        - type: skill
          value: occult-knowledge-basic
      giver: anonymous
      time_limit: 0
      custom_data:
        sanity_cost: 5
  explorable_areas:
    - id: innsmouth-road
      name: 印斯茅斯路
      description: 阿卡姆镇外通往印斯茅斯方向的荒僻道路，沿途散布着废弃的农舍和无人照看的墓地。匿名信中提到的17号就在这条路上。
      type: street
      danger_level: 3
      atmosphere: 荒凉阴森，雾气弥漫，远处似有低语
      sub_locations:
        - id: innsmouth-road-entrance
          name: 印斯茅斯路入口
          description: 离开阿卡姆镇区后的第一个岔路口，一块锈蚀的路牌指向印斯茅斯方向。路牌上的字迹已被风雨侵蚀，但"17"这个数字似乎被人用指甲刻意加深过。雾气在此处变得浓重，能见度不足十码。
          type: gate
          danger_level: 1
          connections:
            - station-exit
        - id: innsmouth-road-17
          name: 印斯茅斯路17号
          description: 一栋维多利亚风格的三层老宅，外墙爬满枯萎的常春藤。门廊上的灯在无人触碰的情况下忽明忽暗，窗户被厚重的黑色窗帘遮得严严实实。门缝下渗出微弱的青绿色光芒，空气中弥漫着海腥味和某种不属于人间的甜腻气息。这就是匿名信指引你来的地方。
          type: building
          danger_level: 4
        - id: abandoned-cemetery
          name: 路边废弃墓地
          description: 道路旁一片被铁栏围起的古老墓地，墓碑上的日期最早可追溯到17世纪。部分坟墓似乎被从内部打开过，泥土堆积的方向不对。最深处有一座没有名字的陵墓，陵墓门上的锁链最近被剪断了。
          type: cemetery
          danger_level: 3
    - id: miskatonic-university
      name: 米斯卡塔尼克大学
      description: 阿卡姆最负盛名的学府，也是禁忌知识的守护者。大学图书馆的禁区收藏着不该被人类阅读的典籍，而地下实验室里进行着不可言说的研究。
      type: institution
      danger_level: 1
      atmosphere: 学术庄严之下暗流涌动，书页间藏着不可名状的秘密
      sub_locations:
        - id: university-entrance
          name: 大学正门
          description: 哥特式的校门拱廊下，穿着学术袍的教授们步履匆匆。门厅的公告栏上贴着各种学术活动通知，但最角落的一张被图钉钉死的羊皮纸上写着一行拉丁文——翻译过来是"知识是诅咒的入口"。
          type: gate
          danger_level: 0
          connections:
            - station-exit
        - id: restricted-library
          name: 图书馆禁区
          description: 图书馆最深处被铁门和警示标志封锁的区域，只有持有特别许可的教授才能进入。书架上摆着用不知名皮革装订的古籍，有些书似乎在自行颤动。空气中弥漫着陈旧羊皮纸和某种说不出的气味，阅读某些书籍后的人声称听到了来自书页间的低语。
          type: library
          danger_level: 2

