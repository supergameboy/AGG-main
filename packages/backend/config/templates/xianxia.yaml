    description: 在灵气充裕之地生长的药草，叶片泛着淡绿灵光，蕴含微薄灵气。灵草可直接服用补充灵气，也是炼丹的基础材料。散修常以采摘灵草为生，在险地寻觅灵草更是修真界的日常。
    category: consumable
    quality: common
    stats:
      qi_recovery: 8
    effects:
      - type: buff
        value: 8
        duration: 3
    value:
      buy: 35
      sell: 18
      currency: spirit_stone
    quantity: 1
    custom_data:
      displayType: 消耗品
      displayRarity: 普通
      displayStats:
        - key: qi_recovery
          label: 灵气恢复
          value: "+8"
      displayEffects:
        - "服用后3回合内缓慢恢复灵气"
        - "可作为炼丹材料使用"
      tags: ["灵草", "炼丹", "消耗品"]
      visualDesc: "翠绿药草，叶片泛着淡绿灵光，散发清新草木香气"
      effects:
        - type: buff
          value: 8
          duration: 3
      price: 18
      locale: zh-CN

  - id: survival-guide
    name: 修真野录
    description: 一本由无名散修编纂的野外生存手册，记载着九州大陆各地的灵草分布、灵兽习性、危险区域和避难之所。内容粗浅却实用，是散修在修真界摸爬滚打的宝贵经验。书中还夹着几页手绘地图，标注了散修聚集的坊市位置。
    category: tool
    quality: common
    stats:
      wis: 1
    effects: []
    value:
      buy: 50
      sell: 25
      currency: spirit_stone
    quantity: 1
    custom_data:
      displayType: 工具
      displayRarity: 普通
      displayStats:
        - key: wis
          label: 神识
          value: "+1"
      displayEffects:
        - "记载灵草分布和灵兽习性，野外生存必备"
        - "标注散修坊市和避难之所的位置"
      tags: ["书籍", "散修", "生存"]
      visualDesc: "泛黄书册，封面已磨损，内页密密麻麻写满笔记"
      locale: zh-CN

  - id: fine-robe
    name: 锦云法袍
    description: 以灵蚕金丝织就的华贵法袍，袍面云纹以金线绣成，灵光流转间尽显富贵。虽防护不俗，但更多是身份的象征——穿此袍者，非富即贵。商贾之家的修士常以此袍彰显财力，在坊市交易时更能获得优待。
    category: armor
    quality: uncommon
    stats:
      defense: 4
      magicDefense: 3
      cha: 1
    effects: []
    value:
      buy: 200
      sell: 100
      currency: spirit_stone
    quantity: 1
    custom_data:
      displayType: 防具
      displayRarity: 优秀
      displayStats:
        - key: defense
          label: 防御力
          value: "+4"
        - key: magicDefense
          label: 魔法防御
          value: "+3"
        - key: cha
          label: 道缘
          value: "+1"
      displayEffects:
        - "华贵法袍彰显财力，坊市交易时更受优待"
      tags: ["法袍", "华贵", "商贾"]
      visualDesc: "金丝云纹法袍，灵光流转，袍角缀以灵玉珠饰"
      locale: zh-CN

  - id: spirit-stone-pouch
    name: 灵石袋
    description: 以灵蚕丝编织的储物袋，内设禁制可安全存放灵石。袋口以灵锁封印，非主人神识不可开启。商贾之家子弟的标准配置，袋中常备充足灵石，以备不时之需。
    category: accessory
    quality: common
    stats: {}
    effects: []
    value:
      buy: 60
      sell: 30
      currency: spirit_stone
    quantity: 1
    custom_data:
      displayType: 法宝
      displayRarity: 普通
      displayStats: []
      displayEffects:
        - "安全存放灵石，内含充足灵石以备不时之需"
        - "坊市交易时更为便利"
      tags: ["储物", "灵石", "商贾"]
      visualDesc: "淡金色丝袋，袋口灵锁微光闪烁，沉甸甸的分量令人安心"
      locale: zh-CN

  - id: quality-pill
    name: 凝神丹
    description: 品质上乘的修炼丹药，以珍稀灵草精心炼制，服用后可凝神聚气，大幅提升修炼效率。丹药呈淡金色，入口即有一股清凉灵气直冲天灵，令人神清气爽。商贾之家以灵石铺路，方能享用此等丹药。
    category: consumable
    quality: uncommon
    stats:
      qi_recovery: 20
      heal: 15
    effects:
      - type: buff
        value: 20
        duration: 5
      - type: heal
        value: 15
    value:
      buy: 100
      sell: 50
      currency: spirit_stone
    quantity: 1
    custom_data:
      displayType: 消耗品
      displayRarity: 优秀
      displayStats:
        - key: qi_recovery
          label: 灵气恢复
          value: "+20"
        - key: heal
          label: 治疗量
          value: "+15"
      displayEffects:
        - "服用后5回合内大幅提升灵气吸收"
        - "同时恢复15点生命值"
      tags: ["丹药", "修炼", "消耗品"]
      visualDesc: "淡金色丹药，表面灵光流转，药香浓郁"
      effects:
        - type: buff
          value: 20
          duration: 5
        - type: heal
          value: 15
      price: 50
      locale: zh-CN

  - id: simple-clothes
    name: 粗布麻衣
    description: 凡间最常见的粗布麻衣，毫无灵气加持，却承载着凡人对修真之路的朴素向往。穿上它，便不会忘记自己来自何方，道心反而更加坚定。凡人出身的修士常说：不忘来路，方知归途。
    category: armor
    quality: common
    stats:
      defense: 1
    effects: []
    value:
      buy: 15
      sell: 8
      currency: spirit_stone
    quantity: 1
    custom_data:
      displayType: 防具
      displayRarity: 普通
      displayStats:
        - key: defense
          label: 防御力
          value: "+1"
      displayEffects: []
      tags: ["衣物", "凡人", "朴素"]
      visualDesc: "灰褐色粗布麻衣，针脚细密，虽朴素却干净整洁"
      locale: zh-CN

  - id: family-heirloom
    name: 传家灵物
    description: 一件代代相传的灵物，或许是祖上偶然获得的灵玉，或许是某位先人留下的修炼信物。灵物中蕴含的灵气虽微薄，却承载着家族的期望和祝福。凡人出身的修士携带此物，仿佛先人护佑，道心更为坚定。
    category: accessory
    quality: uncommon
    stats:
      con: 1
      int: 1
    effects: []
    value:
      buy: 0
      sell: 0
      currency: spirit_stone
    quantity: 1
    custom_data:
      displayType: 法宝
      displayRarity: 优秀
      displayStats:
        - key: con
          label: 体质
          value: "+1"
        - key: int
          label: 悟性
          value: "+1"
      displayEffects:
        - "先人护佑，道心更为坚定"
        - "突破瓶颈时更有优势"
      tags: ["传家宝", "凡人", "护佑"]
      visualDesc: "古朴灵物，表面因代代摩挲而光滑温润，隐约散发微光"
      locale: zh-CN

  - id: lucky-charm
    name: 护身符
    description: 一枚由家中长辈亲手绘制的护身符，符纸虽已泛黄，朱砂灵墨却依然鲜红。凡人无法注入法力，但符中寄托的牵挂和祝福却胜过千般灵力。据说危急时刻，护身符会自行激发，挡下致命一击。
    category: accessory
    quality: common
    stats:
      magicDefense: 2
      dodgeRate: 0.02
    effects: []
    value:
      buy: 45
      sell: 23
      currency: spirit_stone
    quantity: 1
    custom_data:
      displayType: 法宝
      displayRarity: 普通
      displayStats:
        - key: magicDefense
          label: 魔法防御
          value: "+2"
        - key: dodgeRate
          label: 闪避率
          value: "+2%"
      displayEffects:
        - "危急时刻可自行激发，挡下致命一击"
      tags: ["护符", "凡人", "护身"]
      visualDesc: "泛黄符纸以红绳系着，朱砂符文鲜红如新，散发温暖气息"
      locale: zh-CN

