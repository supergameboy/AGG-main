ui_theme:
  primary_color: "#f59e0b"
  font_family: system
  background_style: gradient
  gradient_colors:
    start: "#1a0a2e"
    end: "#2d1b4e"
    direction: to bottom
  background_image: ""
  pattern_type: clouds
  animated_type: particles
  custom_css: ""

ui_layout:
  show_minimap: true
  show_combat_panel: true
  show_skill_bar: true
  show_party_panel: true
  minimap_position: top-left
  minimap_size: medium
  party_panel_position: left
  skill_bar_slots: 5
  custom_layout: ""

special_rules:
  has_kp: false
  permadeath: false
  save_restriction: ""
  custom_rules:
    - 修炼境界系统：角色通过修炼提升境界，每个境界突破需要渡劫
    - 灵气修炼：在灵气充裕之地修炼效率更高
    - 天劫系统：境界突破时需渡天劫，失败则修为倒退
    - 道心系统：道心坚定者突破更容易，道心破碎则修为尽废
