id: xianxia
name: 仙侠修真
description: 天地玄黄，宇宙洪荒。修真者逆天改命，追求长生大道。在这片灵气充盈的九州大陆上，仙门林立，妖兽横行，凡人仰望苍穹，修士踏剑凌云。你将从一个默默无闻的凡人，踏上修仙之路，历经劫难，证道成仙。
version: 1.0.0
author: AGG Team
tags:
  - xianxia
  - cultivation
  - fantasy
  - chinese-mythology
  - martial-arts

game_mode: text_rpg
default_challenge_mode: narrative_combat
numerical_complexity: medium
agent_profile: fantasy_rpg
is_builtin: true

world_setting:
  name: 九州大陆
  description: 九州大陆是一片灵气充盈的修真世界。东有蓬莱仙岛，西有昆仑神山，南有十万大山，北有极寒冰原。修真门派林立，正道魔道纷争不断。凡人仰望苍穹，修士踏剑凌云，追求长生大道。天地间灵气潮汐起伏，大劫将至，谁能证道成仙？
  era: 上古修真纪
  genre: xianxia
  magic_system: 修真功法 - 灵气修炼与道法神通
  technology_level: 古代修真文明
  custom_fields:
    cultivation_realms: 炼气、筑基、金丹、元婴、化神、渡劫、大乘
    major_sects: 天剑宗、太虚门、万法仙宗、幽冥魔宫
    currency: 灵石
    spiritual_energy: 灵气潮汐
    tribulation: 天劫系统

character_creation:
  attribute_points: 10
  attribute_role_mapping:
    physical_power: str
    agility: dex
    endurance: con
    mental_power: int
    perception: wis
    influence: cha
  races:
    - id: human
      name: 人族
      description: 万物之灵，悟性最高。人族修士虽体魄不及妖族，但悟性超群，修炼速度最快，是最常见的修真种族。
      bonuses:
        wis: 1
        int: 1
      penalties:
        con: -1
      abilities:
        - 悟性通灵
        - 道心坚韧
      available_classes:
        - sword-cultivator
        - alchemist
        - formation-master
        - talisman-master
    - id: demon
      name: 妖族
      description: 天生异禀，体魄强健。妖族修士以本体修炼，天生拥有强大的肉身和血脉神通，但悟性略逊人族。
      bonuses:
        str: 2
        con: 1
      penalties:
        int: -1
        cha: -1
      abilities:
        - 血脉神通
        - 妖丹修炼
      available_classes:
        - sword-cultivator
        - alchemist
    - id: spirit
      name: 灵族
      description: 天地灵气孕育而生，与自然亲和。灵族修士天生对灵气敏感，擅长法术和阵法，但肉身较为脆弱。
      bonuses:
        int: 2
        wis: 1
      penalties:
        str: -2
      abilities:
        - 灵气感知
        - 天然道体
      available_classes:
        - alchemist
        - formation-master
        - talisman-master
    - id: half-demon
      name: 半妖
      description: 人妖混血，兼具两族之长。半妖修士既有人族的悟性，又有妖族的体魄，但常受两族排斥。
      bonuses:
        str: 1
        dex: 1
      penalties:
        cha: -1
      abilities:
        - 双重血脉
        - 适应修炼
      available_classes:
        - sword-cultivator
        - formation-master

  classes:
    - id: sword-cultivator
      name: 剑修
      description: 以剑入道，一剑破万法。剑修是最纯粹的战斗修士，追求剑道极致，攻击力冠绝各派。
      primary_attributes:
        - str
        - dex
      hit_die: d10
      skill_proficiencies:
        - sword-arts
        - combat-awareness
        - qi-sensing
      starting_equipment:
        - iron-sword
        - basic-robe
        - qi-gathering-pill
    - id: alchemist
      name: 炼丹师
      description: 炼丹悟道，丹成天地惊。炼丹师擅长炼制丹药辅助修炼，是修真界最受尊敬的职业之一。
      primary_attributes:
        - int
        - wis
      hit_die: d6
      skill_proficiencies:
        - alchemy
        - herb-identification
        - fire-control
      starting_equipment:
        - alchemy-furnace
        - basic-robe
        - herb-collection-bag
    - id: formation-master
      name: 阵法师
      description: 阵法通天，困仙锁神。阵法师擅长布置各种阵法，攻防兼备，是团队中不可或缺的存在。
      primary_attributes:
        - int
        - wis
      hit_die: d8
      skill_proficiencies:
        - formation-arts
        - rune-carving
        - spatial-awareness
      starting_equipment:
        - formation-flags
        - basic-robe
        - spirit-stone
    - id: talisman-master
      name: 符箓师
      description: 符通天地，箓镇鬼神。符箓师擅长绘制各种符箓，一符在手，万法皆通。
      primary_attributes:
        - wis
        - cha
      hit_die: d8
      skill_proficiencies:
        - talisman-arts
        - calligraphy
        - spirit-binding
      starting_equipment:
        - talisman-brush
        - basic-robe
        - blank-talismans

  backgrounds:
    - id: sect-disciple
      name: 宗门弟子
      description: 出身修真大派，自幼修炼。你有良好的修炼资源和师门庇护，但也背负着宗门的期望和责任。
      skill_proficiencies:
        - sect-techniques
        - etiquette
      languages:
        - ancient-script
      equipment:
        - sect-token
        - meditation-mat
        - basic-pill
      feature: 宗门庇护 - 你可以寻求师门帮助，获得修炼资源和保护
      attribute_bonuses:
        wis: 1
    - id: wandering-cultivator
      name: 散修
      description: 无门无派的散修，全凭自身摸索修炼。你缺少资源但自由自在，在险境中磨砺出了过人的生存能力。
      skill_proficiencies:
        - survival
        - streetwise
      languages: []
      equipment:
        - worn-robe
        - rusty-sword
        - spirit-herb
      feature: 野路子 - 你在野外修炼效率更高，更容易发现机缘
      attribute_bonuses:
        con: 1
    - id: merchant-family
      name: 商贾之家
      description: 出身灵石商贾之家，虽非修真世家但财力雄厚。你用灵石铺路，以资源换取修炼速度。
      skill_proficiencies:
        - negotiation
        - appraisal
      languages:
        - trade-tongue
      equipment:
        - fine-robe
        - spirit-stone-pouch
        - quality-pill
      feature: 灵石铺路 - 你可以购买到更好的修炼资源和丹药
      attribute_bonuses:
        cha: 1
    - id: mortal-origin
      name: 凡人出身
      description: 原本只是普通凡人，因机缘巧合踏入修真之路。你对凡间疾苦有深刻理解，道心坚定。
      skill_proficiencies:
        - perseverance
        - mortal-wisdom
      languages: []
      equipment:
        - simple-clothes
        - family-heirloom
        - lucky-charm
      feature: 凡心悟道 - 你对道的理解更接地气，突破瓶颈时更有优势
      attribute_bonuses:
        int: 1

  attributes:
    - id: str
      name: 力量
      abbreviation: STR
      description: 肉身力量，影响近战伤害和体修功法威力
      min_value: 1
      default_value: 10
      max_value: 20
    - id: dex
      name: 敏捷
      abbreviation: DEX
      description: 身法灵巧，影响闪避、先攻和剑修技艺
      min_value: 1
      default_value: 10
      max_value: 20
    - id: con
      name: 体质
      abbreviation: CON
      description: 体魄强健，影响生命值和修炼根基
      min_value: 1
      default_value: 10
      max_value: 20
    - id: int
      name: 悟性
      abbreviation: INT
      description: 悟性与智慧，影响法术威力和修炼速度
      min_value: 1
      default_value: 10
      max_value: 20
    - id: wis
      name: 神识
      abbreviation: WIS
      description: 神识与感知，影响阵法、符箓和灵气感应
      min_value: 1
      default_value: 10
      max_value: 20
    - id: cha
      name: 道缘
      abbreviation: CHA
      description: 道缘与人脉，影响社交和机缘际遇
      min_value: 1
      default_value: 10
      max_value: 20

  custom_options: []

  age_mode: group
  age_groups:
    - id: young
      name: 筑基少年
      description: 初入修途，根骨未定
      bonuses:
        dex: 1
      penalties:
        wis: -1
    - id: youth
      name: 金丹青年
      description: 修为精进，气运正盛
      bonuses: {}
      penalties: {}
    - id: middle
      name: 元婴中年
      description: 道行深厚，法力通玄
      bonuses:
        wis: 1
        int: 1
      penalties:
        dex: -1
    - id: elder
      name: 化神老者
      description: 功参造化，返璞归真
      bonuses:
        int: 2
      penalties:
        str: -1
        con: -1

game_rules:
  combat_system:
    type: turn_based
    initiative_type: dexterity
    custom_initiative: ""
    action_points: 2
    critical_hit:
      threshold: 18
      multiplier: 2.5
    flee:
      base_chance: 0.2
      per_dead_enemy_bonus: 0.15
    defend:
      damage_reduction: 0.4
    damage_formula:
      attack_contribution: 0.6
      defense_reduction: 0.4
      level_bonus_factor: 3
      variance_min: 0.85
      variance_range: 0.3
    enemy_ai:
      skill_use_chance: 0.4
    defaults:
      potion_heal: 50
      mana_potion_restore: 30
      skill_mana_cost: 15
      skill_damage_multiplier: 2.0
      skill_base_damage_factor: 2.5
      attribute_fallback: 10
      enemy_speed_factor: 3
  derived_attribute_formulas:
    maxHealth:
      base: 100
      coefficients: { physical_power: 5, endurance: 15 }
    maxMana:
      base: 50
      coefficients: { mental_power: 10, endurance: 2 }
    attack:
      base: 10
      coefficients: { physical_power: 2, agility: 0.5 }
    defense:
      base: 5
      coefficients: { endurance: 1.5, physical_power: 0.5 }
    magicAttack:
      base: 8
      coefficients: { mental_power: 2.5, perception: 0.3 }
    magicDefense:
      base: 4
      coefficients: { mental_power: 1, endurance: 0.3 }
    speed:
      base: 10
      coefficients: { agility: 1.5, influence: 0.2 }
    critRate:
      base: 0.05
      coefficients: { agility: 0.01, influence: 0.005 }
      max: 0.5
    critDamage:
      base: 1.5
      coefficients: { physical_power: 0.02, influence: 0.01 }
    dodgeRate:
      base: 0.05
      coefficients: { agility: 0.008 }
      max: 0.3
    blockRate:
      base: 0.9
      coefficients: { agility: 0.005, perception: 0.002 }
  skill_system:
    max_level: 10
    cooldown_system: turn
    upgrade_cost:
      base: 150
      multiplier: 1.6
  inventory_system:
    max_slots: 25
    weight_system: false
    stack_sizes:
      pill: 10
      talisman: 20
      material: 99
      misc: 99
    equipment_slots:
      - id: main_hand
        name: 主手
        icon: ⚔
        accepted_item_types:
          - weapon
      - id: off_hand
        name: 副手
        icon: 🛡
        accepted_item_types:
          - weapon
          - accessory
      - id: head
        name: 头部
        icon: ⛑
        accepted_item_types:
          - armor
      - id: body
        name: 身体
        icon: 🛡
        accepted_item_types:
          - armor
      - id: feet
        name: 脚部
        icon: 👢
        accepted_item_types:
          - armor
      - id: accessory
        name: 法宝
        icon: 💍
        capacity: 2
        accepted_item_types:
          - accessory
  quest_system:
    max_active: 8
    time_system: true
    fail_conditions:
      - timeout
      - tribulation-failed
      - dao-heart-broken
  currency_system:
    id: spirit_stone
    name: 灵石
    icon: 💎
  custom_rules:
    - name: 修炼境界
      description: 角色通过修炼提升境界，每个境界突破需要渡劫
    - name: 灵气修炼
      description: 在灵气充裕之地修炼效率更高，灵气枯竭之地修炼困难

ai_constraints:
  tone: epic
  custom_tone: 仙侠修真风格，文言与白话交织
  content_rating: teen
  prohibited_topics:
    - explicit-content
  required_elements:
    - cultivation
    - tribulation
    - dao-insight
    - sect-politics
  ai_behavior:
    response_style: narrative
    detail_level: detailed
    player_agency: balanced

starting_scene:
  location: tianjian-peak
  description: 你站在天剑宗的山门前，云雾缭绕间隐约可见远处的剑光闪烁。一位白衣长老从云端落下，目光如炬地审视着你。"你便是今年新入门的弟子？"他的声音如洪钟大吕，震得你气血翻涌，"修真之路，逆天而行，你可准备好了？"
  location_description: 天剑宗山门，云雾缭绕的修真圣地入口
  atmosphere: 仙气飘渺，剑意隐现

  sub_locations:
    - id: mountain-gate
      name: 天剑宗山门
      description: 巍峨的石牌坊矗立在云雾之中，牌坊上刻着"天剑宗"三个大字，笔力遒劲，隐含剑意。石阶两侧各立着一柄三丈高的石剑，剑身流转着淡青色灵光。山风拂过，云雾翻涌间可见远处群峰如剑直插天际，偶有剑光破空而过。
      type: gate
      is_starting: true
      danger_level: 0

    - id: sword-hall
      name: 剑道大殿
      description: 天剑宗的核心建筑，殿内供奉着历代宗主的佩剑。大殿以千年寒玉铺地，穹顶绘有万剑归宗的壁画，灵气浓郁得几乎凝为实质。每月初一十五，全宗弟子在此听长老讲道。
      type: temple
      danger_level: 0
      services:
        - type: training
          name: 剑道讲法

    - id: alchemy-hall
      name: 丹房
      description: 终年弥漫着药香的石室，数十尊丹炉排列其中，炉火明灭不定。墙壁上的木架上摆满了各色灵草和丹药瓶罐，空气中灵气与药气交织。炼丹师们在此日夜轮值，为宗门炼制修炼所需的丹药。
      type: workshop
      danger_level: 0
      services:
        - type: alchemy
          name: 丹药炼制与交易
        - type: pill_shop
          name: 丹药购买

    - id: disciple-quarters
      name: 弟子居所
      description: 外门弟子的居所，一排排简朴的石屋依山而建。每间石屋前都有一小片灵田，供弟子日常修炼之用。晨昏时分，诵经声与练剑声交织回荡在山间。
      type: residence
      danger_level: 0

    - id: peak-exit
      name: 山门出口
      description: 天剑宗与外界的通道，一道由剑阵守护的石桥横跨深渊。桥面上刻着密密麻麻的阵纹，灵光流转间形成无形的屏障。守桥弟子查验令牌后方可放行，出了此门便是宗门外的天地。
      type: gate
      danger_level: 0
      connections:
        - training-entrance
        - forest-entrance

  npcs:
    - id: elder-baiyun
      location: mountain-gate
      name: 白云长老
      title: 天剑宗外门长老
      description: 天剑宗外门长老，筑基后期修为。看似和蔼实则严厉，负责新弟子的入门考核。
      role: quest_giver
      race: human
      appearance: 白发白须，身着白色道袍，手持拂尘，脚踏祥云
      personality: 严厉、公正、偶尔温和
      dialogue:
        - 修真之路，一步踏错便是万劫不复。
        - 你根基尚浅，需勤加修炼方能在这修真界立足。
        - 宗门每年都会发放修炼资源，但能否得到看你的表现。
      stats:
        level: 15
        hp: 200
        attack: 35
        defense: 25
        speed: 20
        magic: 40
      services:
        - quest
        - training
      custom_data: {}
    - id: senior-sister-lin
      location: disciple-quarters
      name: 林师姐
      title: 天剑宗内门弟子
      description: 天剑宗内门弟子，金丹初期修为。性格爽朗，对新弟子照顾有加，是宗门中的人气角色。
      role: ally
      race: human
      appearance: 青衣长剑，英姿飒爽，眉目间带着几分英气
      personality: 爽朗、热心、偶尔冒失
      dialogue:
        - 师弟/师妹，有什么不懂的尽管问我！
        - 修炼切忌急躁，欲速则不达。
        - 我带你去领入门物资吧，别让白云长老等急了。
      stats:
        level: 8
        hp: 80
        attack: 18
        defense: 12
        speed: 15
        magic: 20
      services:
        - conversation
        - shop
      custom_data: {}
  items:
    - id: qi-gathering-pill
      name: 聚气丹
      description: 最基础的修炼丹药，服用后可加速灵气吸收。炼丹师的入门之作。
      category: consumable
      quality: common
      stats:
        qi_recovery: 10
      effects:
        - type: buff
          value: 10
          duration: 5
      value:
        buy: 50
        sell: 25
        currency: spirit_stone
      quantity: 3
      custom_data:
        displayType: 丹药
        displayRarity: 普通
        displayStats:
          - key: qi_recovery
            label: 灵气恢复
            value: "10"
        displayEffects:
          - 灵气恢复10点
          - 持续5回合
        tags: [consumable, pill, cultivation, qi]
        locale: zh-CN
  quests:
    - id: main-quest-xx1
      name: 踏入仙门
      description: 通过天剑宗的入门考核，正式成为外门弟子，开始你的修真之路。
      type: main
      objectives:
        - id: obj-xx1
          description: 与白云长老交谈了解宗门规矩
          type: talk
          target: elder-baiyun
          required: 1
        - id: obj-xx2
          description: 在练功场完成基础剑法考核
          type: custom
          target: training-ground
          required: 1
        - id: obj-xx3
          description: 前往丹房领取入门物资
          type: explore
          target: alchemy-hall
          required: 1
      rewards:
        - type: experience
          value: 100
        - type: gold
          value: 50
      giver: elder-baiyun
      time_limit: 0
      custom_data: {}
  explorable_areas:
    - id: training-ground
      name: 练功场
      description: 天剑宗外门弟子修炼之地，灵气浓度适中，适合初学者修炼。场地中央竖立着数根刻有阵纹的石柱，可辅助弟子引导灵气运转。
      type: training
      danger_level: 0
      atmosphere: 灵气充盈，剑气纵横
      sub_locations:
        - id: training-entrance
          name: 练功场入口
          description: 练功场与天剑宗主峰之间的石阶通道，两侧种着灵桃树，花瓣随风飘落如雪。通道尽头是一座刻有"勤修苦练"四字的石碑，石碑旁站着负责看守的师兄。
          type: gate
          danger_level: 0
          connections:
            - peak-exit
        - id: training-arena
          name: 演武场
          description: 开阔的青石广场，地面刻着比武阵纹。弟子们在此切磋剑法、比试修为，石柱上的阵纹可在比试时形成防护结界，防止误伤。每日清晨，这里便响起整齐的练剑声。
          type: arena
          danger_level: 0
        - id: meditation-platform
          name: 打坐台
          description: 练功场东侧的高台，台上刻有聚灵阵纹，灵气浓度是外门其他区域的三倍。弟子们在此打坐修炼，闭目吐纳间灵气如丝般涌入经脉。高台边缘种着千年灵松，松涛声有助于入定。
