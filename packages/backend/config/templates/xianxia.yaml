          danger_level: 0
    - id: spirit-forest
      name: 灵兽林
      description: 宗门后山的灵兽栖息地，古木参天，灵气浓郁。林中栖息着各种灵兽，从温顺的灵兔到凶猛的赤焰虎，适合弟子历练。
      type: forest
      danger_level: 2
      atmosphere: 古木幽深，兽鸣阵阵
      sub_locations:
        - id: forest-entrance
          name: 灵兽林入口
          description: 灵兽林外围的守卫点，两名外门弟子常年驻守在此。入口处立着一块石碑，上面刻着林中灵兽的种类和危险等级。空气中弥漫着草木清香和淡淡的兽腥味。
          type: gate
          danger_level: 1
          connections:
            - peak-exit
        - id: forest-depths
          name: 灵兽林深处
          description: 古木遮天的密林深处，阳光只能透过树冠洒下斑驳的光点。灵兽的吼叫声此起彼伏，地面上散落着各种灵草和矿石。越往深处走，灵气越浓，灵兽也越凶猛。据说林中最深处有一头化形灵兽守护着一处上古遗迹。
          type: forest
          danger_level: 3

