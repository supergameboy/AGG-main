        locale: zh-CN
  quests:
    - id: main-quest-1
      name: 暗影初现
      description: 调查森林中出现的异常暗影生物，找出它们的来源并消除威胁。
      type: main
      objectives:
        - id: obj-1
          description: 与村长交谈了解情况
          type: talk
          target: village-elder
          required: 1
        - id: obj-2
          description: 前往暗影森林入口调查
          type: explore
          target: forest-entrance
          required: 1
        - id: obj-3
          description: 击败暗影生物首领
          type: kill
          target: shadow-wolf
          location: deep-forest
          required: 1
      rewards:
        - type: experience
          value: 100
        - type: gold
          value: 50
      giver: village-elder
      time_limit: 0
      custom_data: {}
  explorable_areas:
    - id: shadow-forest
      name: 暗影森林
      description: 白杨村北方一片古老而阴暗的森林，树冠遮天蔽日。最近出现了不明的暗影生物在林中游荡，树木扭曲变形，空气中弥漫着不自然的寒意。
      type: forest
      danger_level: 3
      sub_locations:
        - id: forest-entrance
          name: 暗影森林入口
          description: 森林边缘的地带，还能远远看到白杨村的炊烟。一些扭曲的树干上刻着古老的符文，似乎在警示着前方的危险。
          type: forest_edge
          danger_level: 1
          connections:
            - village-gate
        - id: deep-forest
          name: 暗影森林深处
          description: 阳光几乎无法穿透浓密的树冠，地面覆盖着厚厚的落叶和腐殖质。远处传来隐约的狼嚎，空气中弥漫着腐朽与不祥的气息。
          type: forest
          danger_level: 3

    - id: abandoned-mine
      name: 废弃矿坑
      description: 矮人族曾经在暗影森林深处开采的矿坑，如今已被废弃多年。入口被藤蔓和碎石半掩着，木制的支撑结构已经腐朽。传说深处埋藏着矮人族的宝藏和稀有的秘银矿脉。
      type: dungeon
      danger_level: 5
      sub_locations:
        - id: mine-entrance
          name: 矿坑入口
          description: 矿坑的入口被藤蔓和碎石半掩着，木制的支撑结构已经腐朽。一阵冷风从黑暗的深处吹来，带着金属和潮湿的气味。
          type: dungeon_entrance
          danger_level: 4
          connections:
            - deep-forest
        - id: mine-depths
          name: 矿坑深处
          description: 深入地下的矿道错综复杂，墙壁上残留着矮人开采的痕迹。黑暗中闪烁着不明来源的微光，似乎有什么东西在这些废弃的矿道中栖息。
          type: dungeon
          danger_level: 5
  events:
    - id: shadow-creature-attack
      name: 暗影生物袭击
      description: 暗影生物从森林深处涌出，袭击村庄外围
