id: medieval-fantasy
name: 中世纪奇幻冒险
description: 在艾尔德兰大陆的广袤土地上，元素魔法与钢铁交织。古老的龙族沉睡于山脉深处，暗影势力在边境蠢蠢欲动。选择你的种族与职业，书写属于你的传奇故事。
version: 1.0.0
author: AGG Team
tags:
  - fantasy
  - medieval
  - magic
  - adventure
  - rpg

game_mode: text_rpg
default_challenge_mode: turn_based_combat
numerical_complexity: medium
agent_profile: fantasy_rpg
is_builtin: true

world_setting:
  name: 艾尔德兰大陆
  description: 一片被古老魔法笼罩的大陆，人类、精灵、矮人和半身人共同生活在这片土地上。远古的龙族沉睡在山脉深处，而黑暗势力正在边境蠢蠢欲动。四元素之力流淌在大地的脉络中，只有掌握元素魔法的人才能驾驭这股力量。
  era: 中世纪
  genre: fantasy
  magic_system: 元素魔法
  technology_level: 中世纪
  custom_fields:
    pantheon: 多神教 - 光明神、暗影神、自然女神、锻造之神
    calendar: 龙历纪元
    currency: 金币
    factions: 银盾骑士团、暮光法师塔、暗影兄弟会

character_creation:
  attribute_points: 12
  attribute_role_mapping:
    physical_power: str
    agility: dex
    endurance: con
    mental_power: int
    perception: wis
    influence: cha
  races:
    - id: human
      name: 人类
      description: 适应力强，能力均衡。人类是艾尔德兰大陆上最广泛的种族，以坚韧和创造力闻名。他们没有突出的天赋，却能在任何领域取得成就。
      bonuses:
        cha: 1
      penalties: {}
      abilities:
        - 适应训练
        - 额外专长
      available_classes:
        - warrior
        - mage
        - rogue
        - cleric
    - id: elf
      name: 精灵
      description: 优雅长寿，擅长魔法。精灵族居住在古老的森林中，拥有与自然沟通的天赋。他们的寿命可达数百年，对元素魔法有着天然的亲和力。
      bonuses:
        dex: 2
        int: 1
      penalties:
        con: -1
      abilities:
        - 黑暗视觉
        - 精灵敏锐感官
        - 元素亲和
      available_classes:
        - mage
        - rogue
        - cleric
    - id: dwarf
      name: 矮人
      description: 坚韧耐久，擅长锻造。矮人族世代居住在山脉之中，是最出色的工匠和矿工。他们打造的武器和护甲享誉大陆。
      bonuses:
        str: 1
        con: 2
      penalties:
        dex: -1
      abilities:
        - 黑暗视觉
        - 矮人韧性
        - 锻造精通
      available_classes:
        - warrior
        - cleric
    - id: halfling
      name: 半身人
      description: 灵巧敏捷，幸运眷顾。半身人天性乐观，善于在危险中找到出路。他们的身形虽小，却有着惊人的勇气和运气。
      bonuses:
        dex: 2
        cha: 1
      penalties:
        str: -1
      abilities:
        - 幸运
        - 勇敢
        - 潜行天赋
      available_classes:
        - rogue
        - cleric

  classes:
    - id: warrior
      name: 战士
      description: 近战专家，高生命值。战士是战场上的中流砥柱，精通各种武器和战术。他们以钢铁般的意志和强健的体魄守护同伴。
      primary_attributes:
        - str
        - con
      hit_die: d10
      skill_proficiencies:
        - athletics
        - intimidation
        - perception
      starting_equipment:
        - rusty-sword
        - leather-armor
        - shield
    - id: mage
      name: 法师
      description: 魔法大师，高法力值。法师通过研习古老典籍掌握元素之力，能够施展强大的法术。他们是暮光法师塔的传承者，掌握着毁灭与创造的秘密。
      primary_attributes:
        - int
        - wis
      hit_die: d6
      skill_proficiencies:
        - arcana
        - history
        - investigation
      starting_equipment:
        - wooden-staff
        - apprentice-robe
        - spellbook
    - id: rogue
      name: 盗贼
      description: 潜行暗杀，高暴击率。盗贼擅长在暗处行动，以速度和精准致命一击。他们是暗影兄弟会的精英，擅长情报收集和暗杀任务。
      primary_attributes:
        - dex
        - cha
      hit_die: d8
      skill_proficiencies:
        - stealth
        - sleight_of_hand
        - acrobatics
      starting_equipment:
        - dagger
        - dagger
        - leather-armor
        - thieves-tools
    - id: cleric
      name: 牧师
      description: 治疗辅助，神圣之力。牧师信仰神灵，借助神圣之力治愈伤痛、驱散邪恶。他们是光明神的使者，在黑暗中为同伴带来希望。
      primary_attributes:
        - wis
        - cha
      hit_die: d8
      skill_proficiencies:
        - medicine
        - religion
        - insight
      starting_equipment:
        - mace
        - priest-robe
        - holy-symbol

  backgrounds:
    - id: noble
      name: 贵族
      description: 出身名门，拥有财富和人脉。你从小在宫廷中长大，习惯了权力和礼仪。你的家族在王国中有着举足轻重的地位。
      skill_proficiencies:
        - persuasion
        - history
      languages:
        - elf
      equipment:
        - signet-ring
        - fine-clothes
        - scroll-of-lineage
      feature: 地位特权 - 你可以获得贵族阶层的接待和帮助
      attribute_bonuses:
        cha: 1
    - id: commoner
      name: 平民
      description: 普通出身，脚踏实地。你是一个普通人，但有着不平凡的决心。你了解民间疾苦，也拥有最朴实的生存智慧。
      skill_proficiencies:
        - survival
        - animal-handling
      languages: []
      equipment:
        - travelers-clothes
        - tool-of-trade
        - pouch
      feature: 民间智慧 - 你了解普通人的生活，容易获得平民的信任
      attribute_bonuses:
        con: 1
    - id: urchin
      name: 流浪儿
      description: 街头长大，机敏灵活。你在贫民窟中长大，学会了在艰难环境中生存。街头的经历让你变得机警而务实。
      skill_proficiencies:
        - stealth
        - sleight-of-hand
      languages:
        - thieves-cant
      equipment:
        - tattered-clothes
        - dagger
        - lucky-charm
      feature: 城市求生 - 你熟悉城市的每条暗巷和秘密通道
      attribute_bonuses:
        dex: 1
    - id: scholar
      name: 学者
      description: 饱读诗书，知识渊博。你在学院中度过了多年，对世界有着深刻的理解。你追求知识，相信智慧是改变世界的力量。
      skill_proficiencies:
        - arcana
        - history
      languages:
        - ancient
      equipment:
        - scholar-robes
        - ink-and-quill
        - ancient-tome
      feature: 学者洞察 - 你可以回忆关于任何学术主题的知识
      attribute_bonuses:
        int: 1
    - id: soldier
      name: 士兵
      description: 曾在军队中服役，熟悉战斗和纪律。你经历过战火的洗礼，懂得在战场上生存的法则。
      skill_proficiencies:
        - athletics
        - intimidation
      languages: []
      equipment:
        - soldiers-uniform
        - shield
        - ration-pack
      feature: 军事训练 - 你可以识别军事编制和战术，在军事营地可获得基本补给
      attribute_bonuses:
        str: 1

  attributes:
    - id: str
      name: 力量
      abbreviation: STR
      description: 物理攻击力和负重能力，影响近战伤害和体力劳动
      min_value: 1
      default_value: 10
      max_value: 20
    - id: dex
      name: 敏捷
      abbreviation: DEX
      description: 闪避和先攻能力，影响远程攻击和反应速度
      min_value: 1
      default_value: 10
      max_value: 20
    - id: con
      name: 体质
      abbreviation: CON
      description: 生命值和耐力，影响抗性和恢复能力
      min_value: 1
      default_value: 10
      max_value: 20
    - id: int
      name: 智力
      abbreviation: INT
      description: 魔法攻击和知识判定，影响法术威力和学习能力
      min_value: 1
      default_value: 10
      max_value: 20
    - id: wis
      name: 感知
      abbreviation: WIS
      description: 洞察力和判断力，影响治疗效果和直觉判定
      min_value: 1
      default_value: 10
      max_value: 20
    - id: cha
      name: 魅力
      abbreviation: CHA
      description: 社交影响力和领导力，影响交涉和召唤法术
      min_value: 1
      default_value: 10
      max_value: 20

  custom_options:
  - id: deity
    name: 信仰神祇
    description: 选择你的角色所信仰的神祇
    type: select
    options:
      - 太阳神培罗
      - 战神海若尼斯
      - 幸运女神欧吕尔
      - 自然之神欧拜亥
    default_value: 太阳神培罗
  - id: backstory_detail
    name: 个人经历
    description: 简要描述你的角色过去的特殊经历
    type: text
    options: []
    default_value: ""

  age_mode: group
  age_groups:
    - id: young
      name: 少年
      description: 年少轻狂，身体灵活但经验不足
      bonuses:
        dex: 1
      penalties:
        str: -1
    - id: youth
      name: 青年
      description: 风华正茂，体力和精力处于巅峰
      bonuses: {}
      penalties: {}
    - id: middle
      name: 中年
      description: 沉稳老练，经验丰富但体力开始衰退
      bonuses:
        wis: 1
      penalties:
        dex: -1
    - id: elder
      name: 老年
      description: 饱经沧桑，智慧超群但身体衰弱
      bonuses:
        int: 1
        wis: 1
      penalties:
        str: -1
        con: -1

game_rules:
  combat_system:
    type: turn_based
    initiative_type: dexterity
    custom_initiative: ""
    action_points: 1
    critical_hit:
      threshold: 19
      multiplier: 2
    flee:
      base_chance: 0.3
      per_dead_enemy_bonus: 0.1
    defend:
      damage_reduction: 0.5
    damage_formula:
      attack_contribution: 0.5
      defense_reduction: 0.5
      level_bonus_factor: 2
      variance_min: 0.9
      variance_range: 0.2
    enemy_ai:
      skill_use_chance: 0.3
    element_affinities:
      # 克制关系: attacker_element → {defender_element: multiplier}
      # 1.5 = 强克制, 0.75 = 被克制, 未列出 = 1.0 (无修正)
      fire:
        water: 0.75
        shadow: 1.5
      water:
        fire: 1.5
        arcane: 0.75
      arcane:
        water: 1.5
        holy: 0.75
      holy:
        shadow: 1.5
        arcane: 0.75
      shadow:
        holy: 1.5
        fire: 0.75
    defaults:
      potion_heal: 30
      mana_potion_restore: 20
      skill_mana_cost: 10
      skill_damage_multiplier: 1.5
      skill_base_damage_factor: 2
      attribute_fallback: 10
      enemy_speed_factor: 2
  derived_attribute_formulas:
    maxHealth:
      base: 100
      coefficients: { physical_power: 5, endurance: 15 }
    maxMana:
      base: 50
      coefficients: { mental_power: 10, endurance: 2 }
    attack:
      base: 10
      coefficients: { physical_power: 2, agility: 0.5 }
    defense:
      base: 5
      coefficients: { endurance: 1.5, physical_power: 0.5 }
    magicAttack:
      base: 8
      coefficients: { mental_power: 2.5, perception: 0.3 }
    magicDefense:
      base: 4
      coefficients: { mental_power: 1, endurance: 0.3 }
    speed:
      base: 10
      coefficients: { agility: 1.5, influence: 0.2 }
    critRate:
      base: 0.05
      coefficients: { agility: 0.01, influence: 0.005 }
      max: 0.5
    critDamage:
      base: 1.5
      coefficients: { physical_power: 0.02, influence: 0.01 }
    dodgeRate:
      base: 0.05
      coefficients: { agility: 0.008 }
      max: 0.3
    blockRate:
      base: 0.9
      coefficients: { agility: 0.005, perception: 0.002 }
  skill_system:
    max_level: 10
    cooldown_system: turn
    upgrade_cost:
      base: 100
      multiplier: 1.5
  inventory_system:
    max_slots: 20
    weight_system: true
    stack_sizes:
      potion: 10
      scroll: 5
      gem: 99
      misc: 99
    equipment_slots:
      - id: main_hand
        name: 主手
        icon: ⚔
        accepted_item_types:
          - weapon
      - id: off_hand
        name: 副手
        icon: 🛡
        accepted_item_types:
          - weapon
          - accessory
          - armor
      - id: head
        name: 头部
        icon: ⛑
        accepted_item_types:
          - armor
      - id: body
        name: 身体
        icon: 🛡
        accepted_item_types:
          - armor
      - id: hands
        name: 手部
        icon: 🧤
        accepted_item_types:
          - armor
      - id: feet
        name: 脚部
        icon: 👢
        accepted_item_types:
          - armor
      - id: accessory
        name: 饰品
        icon: 💍
        capacity: 2
        accepted_item_types:
          - accessory
  quest_system:
    max_active: 10
    time_system: true
    fail_conditions:
      - timeout
      - npc_death
      - item_lost
      - enemy_escapes
  currency_system:
    id: gold
    name: 金币
    icon: 🪙
  custom_rules:
    - name: 休息恢复
      description: 在安全地点休息可以恢复全部生命值和法力值
    - name: 经验分配
      description: 队伍中所有成员平分战斗经验

ai_constraints:
  tone: serious
  custom_tone: ""
  content_rating: teen
  prohibited_topics:
    - gore
    - explicit-content
  required_elements:
    - exploration
    - combat
    - character-growth
  ai_behavior:
    response_style: narrative
    detail_level: detailed
    player_agency: balanced

starting_scene:
  location: village-square
  description: 你站在白杨村广场中央，周围是熙熙攘攘的人群。古老的橡树下，一块布告栏贴满了各种委托。远处传来铁匠铺叮叮当当的敲打声，空气中弥漫着面包房飘来的香气。一个看起来很重要的村长正朝你走来，他的眼中带着一丝忧虑......
  location_description: 白杨村，艾尔德兰王国东部平原上的一个宁静村庄，以村中央那棵千年白杨树命名
  atmosphere: 宁静而充满生活气息

  sub_locations:
    - id: village-square-plaza
      name: 白杨村广场
      description: 铺着青石板的广场，矗立着一棵古老的橡树，树荫下是一块贴满委托的布告栏。广场周围分布着铁匠铺、旅店和杂货铺，村民们在这里往来穿梭，热闹非凡。空气中飘散着面包房传来的麦香和铁匠铺的金属敲击声。
      type: plaza
      is_starting: true

    - id: blacksmith
      name: 铁匠铺
      description: 广场东侧的铁匠铺，火炉永不熄灭，墙上挂满了各式武器和农具。矮人铁匠加雷斯和他的学徒们在这里日夜忙碌，打造着村民们需要的器具。
      type: workshop
      danger_level: 0
      services:
        - type: blacksmith
          name: 武器锻造与修理

    - id: inn
      name: 白杨旅店
      description: 广场北侧一栋两层木制建筑，门口的招牌上画着一棵白杨树。旅店老板娘玛莎以热情的招待和可口的炖菜闻名于过往旅人，是冒险者们休整的好去处。
      type: inn
      danger_level: 0
      services:
        - type: inn
          name: 住宿与休息

    - id: general-store
      name: 杂货铺
      description: 广场西侧的小铺子，货架上摆满了各种旅行用品、药水和干粮。老店主汤姆总是眯着眼睛打量每一位顾客，但他店里的东西确实物美价廉。
      type: shop
      danger_level: 0
      services:
        - type: general_store
          name: 旅行用品与杂货

    - id: village-gate
      name: 村口
      description: 白杨村南边的出入口，一条土路从这里延伸向远方的艾尔德兰大道。木制的瞭望塔上，守卫眺望着北方那片幽暗的森林轮廓。
      type: gate
      danger_level: 0
      connections:
        - forest-entrance

  npcs:
    - id: village-elder
      name: 村长艾德温
      title: 白杨村村长
      description: 一位慈祥的老人，白发苍苍但精神矍铄。他管理白杨村已有三十年，深受村民爱戴。
      role: quest_giver
      race: human
      location: village-square-plaza
      appearance: 身穿朴素的褐色长袍，手持一根木杖，腰间挂着一串钥匙
      personality: 慈祥、睿智、有责任感
      dialogue:
        - 欢迎来到白杨村，年轻的冒险者。
        - 最近森林里出现了奇怪的暗影生物，我们需要你的帮助。
        - 这些怪物似乎来自北方的废弃矿坑，那里曾经是矮人的领地。
      stats:
        level: 5
        hp: 40
        attack: 8
        defense: 6
        speed: 4
        magic: 10
      services:
        - quest
      custom_data: {}
    - id: blacksmith-gareth
      name: 铁匠加雷斯
      title: 白杨村铁匠
      description: 一个壮硕的矮人，手臂上满是伤疤。他是村里唯一的铁匠，打造的武器远近闻名。
      role: merchant
      race: dwarf
      location: blacksmith
      appearance: 身材矮壮，满脸络腮胡，围着皮围裙，手中握着一把铁锤
      personality: 粗犷、直率、对锻造充满热情
      dialogue:
        - 需要好武器？来对地方了！
        - 这把剑是我最好的作品，用了上等的秘银。
        - 听说北边的矿坑里有稀有的矿石，可惜那里太危险了。
      stats:
        level: 3
        hp: 50
        attack: 12
        defense: 10
        speed: 3
        magic: 2
      services:
        - shop
        - repair
      custom_data: {}
    - id: innkeeper-martha
      name: 旅店老板娘玛莎
      title: 白杨旅店店主
      description: 一位热情开朗的中年妇女，总是笑眯眯地招呼每一位客人。她的炖菜是村里一绝，旅店的壁炉边总是坐满了人。
      role: service
      race: human
      location: inn
      appearance: 微胖的身材，围着一条绣花的围裙，脸上带着温暖的笑容
      personality: 热情、健谈、善良
      dialogue:
        - 累了就来旅店歇歇脚吧，壁炉边的位置永远为你留着！
        - 听说暗影森林里出现了奇怪的生物，旅人们都不敢进去了。
        - 玛莎特制炖菜，保证让你充满活力！
      stats:
        level: 2
        hp: 20
        attack: 3
        defense: 4
        speed: 5
        magic: 3
      services:
        - inn
      custom_data: {}
    - id: shopkeeper-tom
      name: 老店主汤姆
      title: 杂货铺老板
      description: 一位戴着老花镜的瘦削老人，经营这家杂货铺已有四十余年。他对商品了如指掌，总能从堆满杂物的货架上准确找出顾客需要的东西。
      role: merchant
      race: human
      location: general-store
      appearance: 瘦削的身材，戴着老花镜，总是穿着一件洗得发白的蓝色外套
      personality: 精明、健谈但稍显吝啬
      dialogue:
        - 随便看看，小店虽小但东西齐全。
        - 这瓶药水可是我亲自调的，保证货真价实。
        - 北边矿坑里的矿石可是好东西，可惜现在没人敢去了。
      stats:
        level: 2
        hp: 15
        attack: 2
        defense: 3
        speed: 4
        magic: 5
      services:
        - shop
      custom_data: {}
  items:
    - id: health-potion
      name: 生命药水
      description: 一瓶散发着红色微光的药水，可以恢复生命值。瓶身上刻着炼金术士公会的标记。
      category: consumable
