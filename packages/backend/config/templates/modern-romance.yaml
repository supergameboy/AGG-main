id: modern-romance
name: 现代都市恋爱
description: 在繁华的星城，青春与梦想交织。转学、邂逅、心动——每一段关系都是独一无二的故事。在这个没有魔法的现代世界里，最强大的力量是人心。
version: 1.0.0
author: AGG Team
tags:
  - romance
  - modern
  - visual-novel
  - school-life
  - dating

game_mode: visual_novel
default_challenge_mode: narrative_combat
numerical_complexity: simple
agent_profile: fantasy_rpg
is_builtin: true

world_setting:
  name: 星城
  description: 一座繁华的现代都市，高楼林立，霓虹闪烁。星城学园是这座城市最负盛名的高中，汇聚了来自各地的优秀学生。樱花飘落的校园小径、温馨的咖啡馆、热闹的祭典——这里每天都在上演着青春的故事。
  era: 现代
  genre: romance
  magic_system: 无
  technology_level: 现代
  custom_fields:
    setting: 日本风格都市
    school: 星城学园
    currency: 日元
    season: 春季

character_creation:
  attribute_points: 10
  attribute_role_mapping:
    physical_power: courage
    agility: intelligence
    endurance: empathy
    mental_power: intelligence
    perception: empathy
    influence: charm
  races:
    - id: normal-student
      name: 普通学生
      description: 平凡而真实，在人群中默默生活。你没有特别的光环，却有着最真挚的情感和最朴实的善良。
      bonuses:
        empathy: 1
      penalties: {}
      abilities:
        - 平凡魅力
        - 真诚待人
      available_classes:
        - literature-club
        - sports-club
        - art-club
        - science-club
    - id: transfer-student
      name: 转校生
      description: 从远方而来，带着神秘的气息。你的出现总是引起周围人的好奇和关注，每一段新的邂逅都充满可能。
      bonuses:
        charm: 1
        luck: 1
      penalties: {}
      abilities:
        - 新鲜感
        - 适应力
      available_classes:
        - literature-club
        - sports-club
        - art-club
        - science-club
    - id: returnee
      name: 归国子女
      description: 从海外归来，见多识广。你拥有不同于他人的视角和经历，优雅而自信，却也渴望找到归属感。
      bonuses:
        intelligence: 1
        charm: 1
      penalties: {}
      abilities:
        - 双语优势
        - 国际视野
      available_classes:
        - literature-club
        - art-club
        - science-club
    - id: genius
      name: 天才少年
      description: 天资聪颖，学业出众。你在学术上有着惊人的天赋，但有时会被人认为难以接近。其实你只是不知道如何表达自己的情感。
      bonuses:
        intelligence: 2
      penalties:
        empathy: -1
      abilities:
        - 学业天才
        - 逻辑思维
      available_classes:
        - literature-club
        - science-club

  classes:
    - id: literature-club
      name: 文学部
      description: 热爱文字与故事，在书页间寻找心灵的共鸣。文学部的成员们总是沉浸在小说和诗歌的世界中，用文字编织梦想。
      primary_attributes:
        - intelligence
        - empathy
      hit_die: d6
      skill_proficiencies:
        - writing
        - analysis
        - conversation
      starting_equipment:
        - notebook
        - fountain-pen
        - favorite-novel
    - id: sports-club
      name: 运动部
      description: 在运动场上挥洒汗水，用激情和毅力征服一切。运动部的成员们阳光开朗，以强健的体魄和永不放弃的精神感染着身边的人。
      primary_attributes:
        - courage
        - charm
      hit_die: d10
      skill_proficiencies:
        - athletics
        - teamwork
        - encouragement
      starting_equipment:
        - sports-uniform
        - water-bottle
        - lucky-towel
    - id: art-club
      name: 艺术部
      description: 用画笔和旋律表达内心世界，感受美的存在。艺术部的成员们敏感而富有创造力，他们能看到常人忽略的细微之美。
      primary_attributes:
        - empathy
        - charm
      hit_die: d6
      skill_proficiencies:
        - painting
        - music
        - observation
      starting_equipment:
        - sketchbook
        - colored-pencils
        - portable-music-player
    - id: science-club
      name: 科学部
      description: 追求真理与知识，在实验中探索世界的奥秘。科学部的成员们理性而严谨，相信一切问题都有答案。
      primary_attributes:
        - intelligence
        - courage
      hit_die: d8
      skill_proficiencies:
        - research
        - logic
        - experimentation
      starting_equipment:
        - lab-coat
        - science-notebook
        - magnifying-glass

  backgrounds:
    - id: wealthy-family
      name: 富裕家庭
      description: 出身优渥，从小衣食无忧。你习惯了精致的生活，但内心深处渴望被人真心相待，而非因为家境。
      skill_proficiencies:
        - etiquette
        - conversation
      languages: []
      equipment:
        - designer-uniform
        - luxury-bag
        - family-crest-pin
      feature: 名门光环 - 你的家世让人印象深刻，但也带来了距离感
      attribute_bonuses:
        charm: 1
    - id: ordinary-family
      name: 普通家庭
      description: 温馨平凡的家庭，父母勤劳朴实。你懂得珍惜，也明白幸福的真谛在于身边人的陪伴。
      skill_proficiencies:
        - cooking
        - empathy
      languages: []
      equipment:
        - school-uniform
        - homemade-bento
        - family-photo
      feature: 温暖日常 - 你擅长营造温馨的氛围，让人感到安心
      attribute_bonuses:
        empathy: 1
    - id: single-parent
      name: 单亲家庭
      description: 与一位家长相依为命，你比同龄人更早学会了独立。虽然生活不易，但你从未放弃对幸福的追求。
      skill_proficiencies:
        - independence
        - resilience
      languages: []
      equipment:
        - simple-uniform
        - part-time-job-schedule
        - cherished-memento
      feature: 坚韧之心 - 你不轻易被困难打倒，这份坚强令人动容
      attribute_bonuses:
        courage: 1
    - id: foster-family
      name: 寄养家庭
      description: 在寄养家庭中长大，你学会了适应不同的环境。你渴望一个真正属于自己的家，也在寻找能够接纳你的人。
      skill_proficiencies:
        - observation
        - adaptability
      languages: []
      equipment:
        - worn-uniform
        - travel-journal
        - lucky-charm
      feature: 旅人之心 - 你善于理解不同的人，这份共情力是珍贵的礼物
      attribute_bonuses:
        luck: 1

  attributes:
    - id: charm
      name: 魅力
      abbreviation: CHM
      description: 吸引他人的气质和魅力，影响第一印象和好感度
      min_value: 1
      default_value: 10
      max_value: 20
    - id: intelligence
      name: 智力
      abbreviation: INT
      description: 学业能力和逻辑思维，影响学习效率和解决问题
      min_value: 1
      default_value: 10
      max_value: 20
    - id: courage
      name: 勇气
      abbreviation: CRG
      description: 面对困难时的勇气和决断力，影响关键时刻的选择
      min_value: 1
      default_value: 10
      max_value: 20
    - id: empathy
      name: 共情
      abbreviation: EMP
      description: 理解他人情感的能力，影响对话选择和关系发展
      min_value: 1
      default_value: 10
      max_value: 20
    - id: luck
      name: 幸运
      abbreviation: LCK
      description: 命运的眷顾，影响偶然事件和缘分邂逅
      min_value: 1
      default_value: 10
      max_value: 20

  custom_options: []

  age_mode: number
  age_number:
    min: 16
    max: 60
    default: 22

game_rules:
  combat_system:
    type: narrative
    initiative_type: random
    custom_initiative: ""
    action_points: 1
    critical_hit:
      threshold: 20
      multiplier: 1
    flee:
      base_chance: 0.8
      per_dead_enemy_bonus: 0.1
    defend:
      damage_reduction: 0.7
    damage_formula:
      attack_contribution: 0.3
      defense_reduction: 0.7
      level_bonus_factor: 0.5
      variance_min: 0.9
      variance_range: 0.2
    enemy_ai:
      skill_use_chance: 0.1
    defaults:
      potion_heal: 50
      mana_potion_restore: 30
      skill_mana_cost: 5
      skill_damage_multiplier: 1.2
      skill_base_damage_factor: 1.5
      attribute_fallback: 10
      enemy_speed_factor: 1
  derived_attribute_formulas:
    maxHealth:
      base: 120
      coefficients: { endurance: 8 }
    maxMana:
      base: 60
      coefficients: { mental_power: 6 }
    attack:
      base: 12
      coefficients: { physical_power: 1 }
    defense:
      base: 8
      coefficients: { endurance: 1 }
    magicAttack:
      base: 10
      coefficients: { mental_power: 1.5 }
    magicDefense:
      base: 6
      coefficients: { mental_power: 0.5 }
    speed:
      base: 12
      coefficients: { agility: 1 }
    critRate:
      base: 0.05
      coefficients: { agility: 0.005 }
      max: 0.3
    critDamage:
      base: 1.5
      coefficients: { physical_power: 0.01 }
    dodgeRate:
      base: 0.05
      coefficients: { agility: 0.005 }
      max: 0.2
    blockRate:
      base: 0.92
      coefficients: { agility: 0.003 }
  skill_system:
    max_level: 10
    cooldown_system: none
    upgrade_cost:
      base: 50
      multiplier: 1.3
  inventory_system:
    max_slots: 10
    weight_system: false
    stack_sizes:
      gift: 5
      letter: 10
      consumable: 3
    equipment_slots:
      - id: outfit
        name: 穿搭
        icon: 👔
        accepted_item_types:
          - armor
          - accessory
      - id: accessory
        name: 饰品
        icon: 💍
        capacity: 2
        accepted_item_types:
          - accessory
      - id: bag
        name: 随身包
        icon: 👜
        accepted_item_types:
          - accessory
  quest_system:
    max_active: 5
    time_system: true
    fail_conditions:
      - timeout
      - relationship-broken
  currency_system:
    id: yen
    name: 日元
    icon: 💴
  custom_rules:
    - name: 好感度系统
      description: 与NPC的互动会影响好感度，好感度决定关系走向
    - name: 时间流逝
      description: 每个选择都会推进时间，珍惜每一次相遇

ai_constraints:
  tone: romantic
  custom_tone: ""
  content_rating: everyone
  prohibited_topics:
    - violence
    - horror
    - explicit-content
  required_elements:
    - romance
    - character-development
    - emotional-moments
  ai_behavior:
    response_style: narrative
    detail_level: detailed
    player_agency: guided

starting_scene:
  location: school-gate
  description: 樱花纷飞的四月初，你站在星城学园的校门前。春风拂面，带着淡淡的花香。远处的钟楼传来悠扬的钟声，学生们三三两两地走进校园。这是你在这所学校的第一个春天——新的开始，新的邂逅，一切皆有可能......
  location_description: 星城学园校门，樱花纷飞的校园入口
  atmosphere: 青春洋溢，樱花纷飞，充满期待与悸动

  sub_locations:
    - id: school-entrance
      name: 校门入口
      description: 星城学园标志性的拱形校门，门柱上缠绕着盛开的紫藤花。樱花树夹道而立，花瓣随风飘落如粉色的雪。学生们三三两两地穿过校门，笑声和问候声此起彼伏。公告栏上贴着新学期的社团招新海报，色彩斑斓。
      type: gate
      is_starting: true
      danger_level: 0

    - id: school-courtyard
      name: 中央庭院
      description: 校园中央的开阔庭院，中央是一座喷泉，水花在阳光下折射出彩虹。四周种着樱花树和银杏树，长椅上坐着看书或聊天的学生。这里是校园中最热闹的地方，也是邂逅最常发生的场所。
      type: plaza
      danger_level: 0

    - id: main-building
      name: 教学主楼
      description: 红砖建筑的教学主楼，走廊里回荡着上课铃声和朗朗书声。一楼大厅的鞋柜区是每天早上最拥挤的地方，也是偷偷塞情书的热门地点。楼梯转角的窗台可以望见整个校园，是许多人独处思考的秘密角落。
      type: building
      danger_level: 0

    - id: club-building
      name: 社团活动楼
      description: 专门供社团活动的三层小楼，每层都有不同社团的活动室。文学部的教室里总是飘着红茶的香气，运动部的更衣室里回荡着加油声，艺术部的画室里颜料味与音乐声交织，科学部的实验室里偶尔传来轻微的爆炸声。
      type: building
      danger_level: 0

    - id: school-exit
      name: 学校后门
      description: 通向校外商业街的侧门，门外的坡道两旁开满了小花店和咖啡馆。放学后这里总是最热闹，同学们约着一起去吃可丽饼或者唱卡拉OK。夕阳把整条坡道染成橘红色，是最适合告白的时刻。
      type: gate
      danger_level: 0
      connections:
        - shopping-entrance
        - park-entrance

  npcs:
    - id: sakura-mizuki
      location: club-building
      name: 水月樱
      title: 文学部部长
      description: 长发如瀑的文学部部长，总是安静地坐在窗边读书。她看似冷淡，实则内心温柔，只是不善于表达。据说她的小说曾在文学杂志上获奖。
      role: ally
      race: human
      appearance: 黑色长发及腰，总是戴着一枚银色书签发夹，校服整洁
      personality: 内敛、温柔、文学少女
      dialogue:
        - ......你也喜欢这本书吗？
        - 文字是有温度的，只是需要用心去感受。
        - 每天放学后，文学部的教室里总有一杯温热的红茶。
      stats:
        level: 3
        hp: 30
        attack: 3
        defense: 5
        speed: 6
        magic: 8
      services:
        - conversation
      custom_data:
        affection: 0
        favorite: literature
    - id: hayate-ren
      location: school-courtyard
      name: 莲疾风
      title: 学生会副会长
      description: 学生会副会长兼运动部王牌，阳光开朗的校园偶像。他总是面带微笑，对谁都温柔以待，但似乎没有人真正了解他的内心。
      role: ally
      race: human
      appearance: 短发微卷，笑容温暖，运动部夹克外套在校服外
      personality: 开朗、温柔、完美主义
      dialogue:
        - 早上好！今天天气真不错呢。
        - 有什么困难的话，随时可以来找我。
        - 其实......我也有不知道该怎么办的时候。
      stats:
        level: 5
        hp: 50
        attack: 8
        defense: 6
        speed: 10
        magic: 4
      services:
        - conversation
        - quest
      custom_data:
        affection: 0
        favorite: sports
  items: []
  quests:
    - id: romance-quest-1
      name: 春日邂逅
      description: 在星城学园的第一天，去认识新的朋友吧。也许某个人会成为你特别的存在。
      type: main
      objectives:
        - id: rq1-1
          description: 在校园中探索，与至少一位同学交谈
          type: talk
          target: any
          required: 1
        - id: rq1-2
          description: 选择一个社团加入
          type: custom
          target: club
          required: 1
      rewards:
        - type: experience
          value: 30
        - type: skill
          value: first-impression
      giver: system
      time_limit: 0
      custom_data: {}
  explorable_areas:
    - id: shopping-district
      name: 商业街
      description: 学校后门外的热闹商业街，两旁排列着各式小店和咖啡馆，是学生们放学后最爱的去处。
      type: commercial
      danger_level: 0
      atmosphere: 热闹温馨，食物香气与笑声交织
      sub_locations:
        - id: shopping-entrance
          name: 商业街入口
          description: 从学校后门延伸出的缓坡尽头，一块手绘风格的木牌写着"星坂商店街"。街道两旁挂满了彩色灯笼和手写招牌，空气中飘着可丽饼和章鱼烧的香气。放学时分，穿着制服的学生们将这里挤得水泄不通。
          type: gate
          danger_level: 0
          connections:
            - school-exit
        - id: cafe-harmony
          name: 和音咖啡馆
          description: 商业街角落一家温馨的咖啡馆，门口的黑板上用彩色粉笔写着今日推荐。店内弥漫着咖啡和肉桂的香气，靠窗的位置可以看见街上来来往往的人。据说这里的拿铁拉花会根据常客的喜好定制，是最适合约会的地点。
          type: social
          danger_level: 0
        - id: karaoke-planet
          name: KTV星球
          description: 商业街最热闹的娱乐场所，门口的霓虹招牌闪烁着星星图案。包厢里回荡着走调的歌声和欢笑声，点歌本上最受欢迎的永远是那几首情歌对唱。这里是社团聚会和生日派对的常驻地，也是许多告白故事的起点。
          type: entertainment
          danger_level: 0
    - id: starlight-park
      name: 星光公园
      description: 城市中心的绿意公园，有大片的草坪、蜿蜒的小径和一座星光观测台。夜晚的公园是观赏星空的绝佳地点，也是情侣们最爱的散步场所。
      type: park
      danger_level: 0
      atmosphere: 宁静浪漫，花香与星光相伴
      sub_locations:
        - id: park-entrance
          name: 公园入口
          description: 公园的拱形铁门入口，门上缠绕着盛开的蔷薇。入口处的花坛四季常开，当前是樱花和紫藤的季节。长椅上坐着一对对情侣，空气中飘着花香和远处传来的吉他声。
          type: gate
          danger_level: 0
          connections:
            - school-exit
        - id: observatory-hill
          name: 观星丘
          description: 公园内一座缓坡小丘，丘顶有一座白色圆顶的天文观测台。夜晚这里可以清晰地看到满天星斗，是校园传说中最灵验的告白地点——在流星划过的瞬间告白，就一定会成功。丘顶的风总是很温柔，像是大自然也在为恋人们加油。
          type: landmark
          danger_level: 0

