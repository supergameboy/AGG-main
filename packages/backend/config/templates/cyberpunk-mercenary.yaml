id: cyberpunk-mercenary
name: 赛博朋克佣兵
description: 2087年的新东京，霓虹灯永不熄灭，雨水冲刷着被污染的街道。巨型企业控制一切，黑客在暗网中穿行，而你——一个在刀尖上跳舞的佣兵——将用自己的方式改写这座城市的命运。
version: 1.0.0
author: AGG Team
tags:
  - cyberpunk
  - noir
  - sci-fi
  - action
  - mercenary

game_mode: text_rpg
default_challenge_mode: dynamic_combat
numerical_complexity: complex
agent_profile: fantasy_rpg
is_builtin: true

world_setting:
  name: 新东京
  description: 2087年的新东京，一座被巨型企业统治的超级都市。霓虹灯永不熄灭，雨水冲刷着被污染的街道。在光鲜的摩天大楼之上，是权贵们的空中花园；在地面之下，是无数挣扎求生的底层市民。赛博空间与现实交织，义体改造模糊了人与机器的界限。在这里，信息是最昂贵的货币，而生命是最廉价的消耗品。
  era: 2087年
  genre: cyberpunk
  magic_system: 无 - 赛博空间与义体科技
  technology_level: 高度发达
  custom_fields:
    megacorps: 荒坂重工、军用科技、网络科技、生物动力
    net_type: 赛博空间
    currency: 信用点
    districts: 霓虹区、企业区、暗巷区、港口区、地下城
    augmentation: 义体改造系统

character_creation:
  attribute_points: 10
  attribute_role_mapping:
    physical_power: str
    agility: dex
    endurance: con
    mental_power: int
    perception: wis
    influence: cha
  races:
    - id: human
      name: 人类
      description: 未改造的纯种人类。在这个时代，保持纯粹既是劣势也是骄傲。你没有义体的依赖，也不受赛博空间的侵蚀。
      bonuses:
        # charisma → cha
        cha: 1
      penalties: {}
      abilities:
        - 人类适应力
        - 社会工程
      available_classes:
        - hacker
        - soldier
        - fixer
        - techie
    - id: cyborg
      name: 改造人
      description: 经过义体改造的半机械人。用血肉换取力量，在钢铁中寻找人性。你的身体一半是原生的，一半是工业制品。
      bonuses:
        # strength → str
        str: 1
        # vitality → con
        con: 1
      penalties:
        # charisma → cha
        cha: -1
      abilities:
        - 义体强化
        - 内置HUD
      available_classes:
        - soldier
        - hacker
        - techie
    - id: android
      name: 仿生人
      description: 高度拟真的人造生命体。拥有超越人类的计算能力，却缺少真正的情感。你是科技的奇迹，也是伦理的灰色地带。
      bonuses:
        # intelligence → int
        int: 2
      penalties:
        # charisma → cha
        cha: -1
      abilities:
        - 数据接口
        - 快速学习
      available_classes:
        - hacker
        - techie
    - id: mutant
      name: 变异者
      description: 辐射变异的幸存者。被社会排斥，却拥有常人不具备的异能。新东京的地下城是你的庇护所，也是你的牢笼。
      bonuses:
        # vitality → con
        con: 2
      penalties:
        # charisma → cha
        cha: -2
      abilities:
        - 辐射抗性
        - 异能觉醒
      available_classes:
        - soldier
        - techie

  classes:
    - id: hacker
      name: 黑客
      description: 网络入侵专家。在赛博空间中如鱼得水，能够攻破任何防火墙。你的武器是代码，你的战场是网络。
      primary_attributes:
        # intelligence → int
        - int
      hit_die: d6
      skill_proficiencies:
        - hacking
        - electronics
        - investigation
      starting_equipment:
        - cyberdeck
        - data-shard
        - hacking-module
    - id: soldier
      name: 士兵
      description: 重火力战斗专家。无论是街头火拼还是企业战争，你都是最可靠的战力。你的身体就是武器，你的意志就是弹药。
      primary_attributes:
        # strength → str
        - str
        # vitality → con
        - con
      hit_die: d10
      skill_proficiencies:
        - firearms
        - athletics
        - intimidation
      starting_equipment:
        - assault-rifle
        - combat-armor
        - medkit
    - id: fixer
      name: 掮客
      description: 情报交易和谈判高手。你认识所有人，所有人也认识你。在新东京，信息比子弹更有杀伤力。
      primary_attributes:
        # charisma → cha
        - cha
        # intelligence → int
        - int
      hit_die: d8
      skill_proficiencies:
        - persuasion
        - streetwise
        - deception
      starting_equipment:
        - smartphone
        - concealed-pistol
        - contacts-list
    - id: techie
      name: 技师
      description: 机械和无人机操控专家。你能让任何机器为你所用，从纳米机器人到重型机甲。在你的手中，废铁也能变成致命武器。
      primary_attributes:
        # intelligence → int
        - int
        # agility → dex
        - dex
      hit_die: d8
      skill_proficiencies:
        - engineering
        - drone-operation
        - crafting
      starting_equipment:
        - drone-kit
        - tool-set
        - tech-visor

  backgrounds:
    - id: corporate
      name: 企业精英
      description: 曾是大型企业的高管。你习惯了权力和奢华，直到某天一切化为乌有。被企业抛弃的你，带着内部知识和复仇的渴望来到了地下世界。
      skill_proficiencies:
        - persuasion
        - bureaucracy
      languages:
        - corporate-jargon
      equipment:
        - designer-suit
        - corporate-id
        - expense-account
      feature: 企业人脉 - 你仍然保留着一些企业内部的关系
      attribute_bonuses:
        # charisma → cha
        cha: 1
    - id: street
      name: 街头混混
      description: 在贫民窟摸爬滚打。你学会了用拳头和智慧在底层生存。暗巷是你的主场，帮派是你的家人。
      skill_proficiencies:
        - streetwise
        - survival
      languages:
        - street-slang
      equipment:
        - tattered-jacket
        - switchblade
        - stash-map
      feature: 街头智慧 - 你了解地下世界的每一条规则
      attribute_bonuses:
        # agility → dex
        dex: 1
    - id: middle-class
      name: 中产市民
      description: 普通的城市居民。你曾经拥有体面的工作和温馨的家，直到一场企业战争摧毁了一切。现在你只想要活下去，顺便讨个公道。
      skill_proficiencies:
        - computers
        - driving
      languages: []
      equipment:
        - casual-clothes
        - personal-link
        - savings-chip
      feature: 市民身份 - 你拥有合法的身份和信用记录
      attribute_bonuses:
        # intelligence → int
        int: 1
    - id: ex-military
      name: 退役军人
      description: 曾在军队服役。战场上的经历让你变得坚韧，也留下了无法愈合的伤疤。退役后你成了佣兵，因为除了战斗，你不知道还能做什么。
      skill_proficiencies:
        - firearms
        - tactics
      languages:
        - military-code
      equipment:
        - dog-tags
        - old-uniform
        - service-weapon
      feature: 军事训练 - 你对武器和战术有着专业的了解
      attribute_bonuses:
        # vitality → con
        con: 1

  attributes:
    # strength → str
    - id: str
      name: 力量
      abbreviation: STR
      description: 物理攻击和负重，影响近战伤害和义体功率
      min_value: 1
      default_value: 10
      max_value: 20
    # agility → dex
    - id: dex
      name: 敏捷
      abbreviation: DEX
      description: 反应速度和闪避，影响先攻和远程攻击
      min_value: 1
      default_value: 10
      max_value: 20
    # intelligence → int
    - id: int
      name: 智力
      abbreviation: INT
      description: 黑客能力和逻辑推理，影响赛博空间操作和技术判定
      min_value: 1
      default_value: 10
      max_value: 20
    # vitality → con
    - id: con
      name: 体质
      abbreviation: CON
      description: 生命值和耐力，影响义体兼容性和抗性
      min_value: 1
      default_value: 10
      max_value: 20
    # charisma → cha
    - id: cha
      name: 魅力
      abbreviation: CHA
      description: 社交影响力和谈判，影响情报获取和关系建立
      min_value: 1
      default_value: 10
      max_value: 20
    # 新增: wis (感知)
    - id: wis
      name: 感知
      abbreviation: WIS
      description: 洞察力和判断力，影响侦查和警觉判定
      min_value: 1
      default_value: 10
      max_value: 20

  custom_options: []

  age_mode: number
  age_number:
    min: 18
    max: 80
    default: 28

game_rules:
  combat_system:
    type: real_time
    initiative_type: dex  # agility → dex
    custom_initiative: ""
    action_points: 2
    critical_hit:
      threshold: 18
      multiplier: 2.5
    flee:
      base_chance: 0.4
      per_dead_enemy_bonus: 0.15
    defend:
      damage_reduction: 0.3
    damage_formula:
      attack_contribution: 0.6
      defense_reduction: 0.3
      level_bonus_factor: 1.5
      variance_min: 0.85
      variance_range: 0.3
    enemy_ai:
      skill_use_chance: 0.4
    defaults:
      potion_heal: 40
      mana_potion_restore: 25
      skill_mana_cost: 12
      skill_damage_multiplier: 1.8
      skill_base_damage_factor: 2.2
      attribute_fallback: 10
      enemy_speed_factor: 2
  derived_attribute_formulas:
    maxHealth:
      base: 80
      coefficients: { physical_power: 3, endurance: 12, mental_power: 2 }
    maxMana:
      base: 40
      coefficients: { mental_power: 12, perception: 4, endurance: 1 }
    attack:
      base: 8
      coefficients: { physical_power: 2.5, agility: 1, mental_power: 0.3 }
    defense:
      base: 4
      coefficients: { endurance: 2, physical_power: 1, agility: 0.3 }
    magicAttack:
      base: 6
      coefficients: { mental_power: 3, perception: 0.5, influence: 0.2 }
    magicDefense:
      base: 3
      coefficients: { mental_power: 1.5, endurance: 0.5, perception: 0.2 }
    speed:
      base: 12
      coefficients: { agility: 2, influence: 0.5, physical_power: 0.2 }
    critRate:
      base: 0.06
      coefficients: { agility: 0.012, perception: 0.004, influence: 0.003 }
      max: 0.6
    critDamage:
      base: 1.4
      coefficients: { physical_power: 0.025, agility: 0.01, influence: 0.008 }
    dodgeRate:
      base: 0.06
      coefficients: { agility: 0.01, perception: 0.003 }
      max: 0.35
    blockRate:
      base: 0.88
      coefficients: { agility: 0.006, perception: 0.004, mental_power: 0.001 }
  skill_system:
    max_level: 15
    cooldown_system: time
    upgrade_cost:
      base: 200
      multiplier: 1.8
  inventory_system:
    max_slots: 30
    weight_system: false
    stack_sizes:
      ammo: 99
      chip: 10
      consumable: 5
    equipment_slots:
      - id: main_hand
        name: 主手
        icon: ⚔
        accepted_item_types:
          - weapon
      - id: body
        name: 身体
        icon: 🛡
        accepted_item_types:
          - armor
      - id: head
        name: 头部
        icon: 🪖
        accepted_item_types:
          - armor
          - accessory
      - id: hands
        name: 手部
        icon: 🧤
        accepted_item_types:
          - armor
          - accessory
      - id: accessory
        name: 饰品
        icon: 💍
        capacity: 2
        accepted_item_types:
          - accessory
  quest_system:
    max_active: 5
    time_system: true
    fail_conditions:
      - timeout
      - alert-triggered
      - npc-death
  currency_system:
    id: credit
    name: 信用点
    icon: 💳
  custom_rules:
    - name: 义体过热
      description: 使用义体能力过多会导致过热，需要冷却时间
    - name: 网络入侵
      description: 黑客可以在战斗中入侵敌方设备获得优势

ai_constraints:
  tone: dark
  custom_tone: 赛博朋克黑色电影风格
  content_rating: mature
  prohibited_topics: []
  required_elements:
    - conspiracy
    - moral-dilemma
    - technology-vs-humanity
  ai_behavior:
    response_style: noir
    detail_level: detailed
    player_agency: high

starting_scene:
  location: neon-district
  description: 雨水打湿了霓虹灯闪烁的街道，你站在阴暗的小巷中。远处传来警笛声，头顶的全息广告不断播放着荒坂重工的宣传语。你的数据终端突然震动——一条加密信息：「如果你想知道真相，来第13区的旧仓库。——V」
  location_description: 霓虹区，新东京最混乱的街区之一，雇佣兵与情报贩子的聚集地
  atmosphere: 阴暗潮湿，霓虹灯永不熄灭

  sub_locations:
    - id: neon-alley
      name: 霓虹小巷
      description: 阴暗潮湿的小巷，墙壁上涂满了荧光涂鸦，头顶的全息广告牌不断闪烁。雨水顺着锈蚀的管道滴落，空气中弥漫着合成食品的油腻气味和电路烧焦的焦糊味。这里是新东京地下世界的入口，每个转角都可能藏着危险或机遇。
      type: alley
      is_starting: true
      danger_level: 1

    - id: merc-hq
      name: 佣兵总部大厅
      description: 一座改造过的旧工厂大厅，天花板上悬挂着巨大的全息任务板，不断滚动着各类委托信息。大厅中央是一张磨损的金属长桌，佣兵们在此交换情报和分配任务。角落里的自动售货机出售从兴奋剂到加密芯片的一切。
      type: headquarters
      danger_level: 0
      services:
        - type: mission_board
          name: 委托任务板
        - type: vending
          name: 自动售货机

    - id: armory
      name: 装备库
      description: 总部的地下装备库，铁架上整齐排列着从手枪到重机枪的各类武器，防弹衣和战术装备按型号分类存放。空气中弥漫着枪油和金属的气味，角落里有一台3D打印机正在缓慢地制造定制零件。
      type: workshop
      danger_level: 0
      services:
        - type: weapon_shop
          name: 武器装备交易
        - type: repair
          name: 装备维修与改装

    - id: intel-room
      name: 情报室
      description: 一间被厚重铅板屏蔽的密室，墙壁上嵌满了显示屏，实时监控着新东京各区的数据流。中央的全息投影桌上漂浮着三维城市地图，红色标记点标注着最新的事件和委托目标。这里是佣兵总部的神经中枢。
      type: intel_center
      danger_level: 0
      services:
        - type: information
          name: 情报交易
        - type: network_access
          name: 暗网接入

    - id: neon-exit
      name: 街区出口
      description: 霓虹区与外界的交界处，一道锈迹斑斑的铁门上方闪烁着"出口"的全息标识。门口站着两个义体改造的守卫，他们的机械眼扫视着每一个进出的人。从这里可以前往新东京的其他区域。
      type: gate
      danger_level: 0
      connections:
        - warehouse-entrance
        - cafe-main

  npcs:
    - id: fixer-viper
      location: neon-alley
      name: 毒蛇
      title: 地下情报贩子
      description: 一个永远戴着墨镜的神秘人物，据说能搞到任何信息。在新东京的地下世界，毒蛇的名字就是信誉的保证。
      role: quest_giver
      race: human
      appearance: 黑色风衣，反光墨镜，手指上满是银色义体接口
      personality: 狡猾、谨慎、利益至上
      dialogue:
        - 你有胆量来找我，说明你确实想知道真相。
        - 这条信息值500信用点，但你看起来付不起......算了，就当是投资。
        - 荒坂重工在上周进行了一次秘密实验，之后整个第13区就被封锁了。
      stats:
        level: 8
        hp: 60
        attack: 15
        defense: 10
        speed: 8
        magic: 5
      services:
        - quest
        - information
      custom_data: {}
  items:
    - id: stim-pack
      name: 兴奋剂
      description: 一次性注射器，暂时提升反应速度。黑市上最常见的战斗辅助药剂，副作用是使用后会头痛欲裂。
      category: consumable
      quality: common
      stats:
        # agility_boost → dex_boost
        dex_boost: 2
      effects:
        - type: buff
          value: 2
          duration: 3
      value:
        buy: 100
        sell: 50
        currency: credit
      quantity: 1
      custom_data:
        displayType: 消耗品
        displayRarity: 普通
        displayStats:
          - key: dex_boost
            label: 敏捷提升
            value: "+2"
        displayEffects:
          - 敏捷+2持续3回合
          - 使用后头痛副作用
        tags: [consumable, buff, combat, stim]
        locale: zh-CN
  quests:
    - id: main-quest-cp1
      name: 加密信号
      description: 追踪神秘的加密信息来源，揭开荒坂重工秘密实验的真相。
      type: main
      objectives:
        - id: obj-cp1
          description: 前往第13区旧仓库
          type: explore
          target: warehouse-13
          required: 1
        - id: obj-cp2
          description: 调查荒坂重工的秘密实验
          type: investigate
          target: arasaka-lab
          required: 1
      rewards:
        - type: experience
          value: 200
        - type: credit
          value: 500
      giver: anonymous
      time_limit: 0
      custom_data: {}
  explorable_areas:
    - id: warehouse-13
      name: 第13区旧仓库
      description: 废弃的工业仓库群，据说隐藏着不可告人的秘密。入口处有企业安保系统的痕迹，空气中弥漫着化学药品的刺鼻气味。
      type: building
      danger_level: 4
      atmosphere: 阴森压抑，金属与化学药品的气味交织
      sub_locations:
        - id: warehouse-entrance
          name: 仓库入口
          description: 锈迹斑斑的铁门半开着，门框上残留着荒坂重工的安保系统扫描器，红色指示灯已经熄灭。地面上有新鲜的轮胎痕迹，说明最近有人来过。铁门旁的墙壁上用荧光喷漆写着"禁止入内"的警告。
          type: entrance
          danger_level: 2
          connections:
            - neon-exit
        - id: warehouse-interior
          name: 仓库内部
          description: 巨大的仓库空间，堆满了标注着荒坂重工标志的集装箱。中央有一台仍在运行的服务器阵列，全息屏幕上闪烁着加密数据流。角落里有一张临时搭建的手术台，上面残留着不明液体。头顶的工业灯管忽明忽暗，投下不安的影子。
          type: laboratory
          danger_level: 4
        - id: warehouse-basement
          name: 仓库地下室
          description: 隐藏在地板下的秘密实验室，需要通过生物识别才能进入。冰冷的金属走廊通向一间密封的房间，房间里保存着荒坂重工秘密实验的完整记录和样本。空气中弥漫着消毒水和某种说不出的甜腥味，墙壁上的隔音棉暗示这里曾经传出过不该被听到的声音。
          type: secret_lab
          danger_level: 5
    - id: dark-net-cafe
      name: 暗网咖啡馆
      description: 黑客们的聚集地，隐藏在一条不起眼的巷子深处。从外面看只是一家破旧的茶馆，但地下层却是新东京最活跃的暗网节点之一。
      type: social
      danger_level: 1
      atmosphere: 昏暗嘈杂，键盘敲击声与低语交织
      sub_locations:
        - id: cafe-main
          name: 咖啡馆大厅
