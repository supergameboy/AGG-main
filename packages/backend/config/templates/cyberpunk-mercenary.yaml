ui_theme:
  primary_color: "#06b6d4"
  font_family: monospace
  background_style: gradient
  gradient_colors:
    start: "#0a0a1a"
    end: "#1a0a2e"
    direction: to bottom
  background_image: ""
  pattern_type: grid
  animated_type: rain
  custom_css: ""

ui_layout:
  show_minimap: true
  show_combat_panel: true
  show_skill_bar: true
  show_party_panel: false
  minimap_position: top-right
  minimap_size: small
  party_panel_position: right
  skill_bar_slots: 6
  custom_layout: ""

special_rules:
  has_kp: false
  permadeath: true
  save_restriction: checkpoint_only
  custom_rules:
    - 义体过热：过度使用义体能力需要冷却
    - 网络入侵：黑客可在战斗中入侵敌方设备
    - 永久死亡：角色死亡不可复活
    - 检查点存档：仅在关键节点可以存档
